      push([null, 'GEOGRAPHY TAM / SAM / ARR ($M for TAM & SAM, $ for ARR)']);
      push([null, 'Market — TAM', 'Y1', 'Y2', 'Y3', 'Y4', 'Y5']);
      const geographies = refs.model.geographies || [];
      const geoTamRows = geographies.map(g => push([null, g.name || '']));
      const geoTamTotalRow = geographies.length ? push([null, 'TOTAL INTERNATIONAL TAM ($M)']) : null;
      push([]);
      push([null, 'Market — SAM', 'Y1', 'Y2', 'Y3', 'Y4', 'Y5']);
      const geoSamRows = geographies.map(g => push([null, g.name || '']));
      const geoSamTotalRow = geographies.length ? push([null, 'TOTAL INTERNATIONAL SAM ($M)']) : null;
      push([]);
      push([null, 'Market — ARR', 'Y1', 'Y2', 'Y3', 'Y4', 'Y5']);
      const geoArrRows = geographies.map(g => push([null, g.name || '']));
      const geoArrTotalRow = geographies.length ? push([null, 'TOTAL INTERNATIONAL ARR']) : null;
      push([]);
      push([null, 'GRAND TOTAL — PRIMARY MARKET ARR + INTERNATIONAL ARR']);
      const grandTotalRow = push([null, 'Grand Total ARR']);

      const ws = XLSX.utils.aoa_to_sheet(aoa);

      YEAR_COLS.forEach((col, i) => {
        const L = xlCol(col);

        segments.forEach((s, idx) => {
          const r = segStartRow + idx;
          const clientsC = s.clientsByYear?.[i] ?? 0;
          const acvCell = `Assumptions!$H$${refs.segmentsStart + idx}`;
          const acvCell2 = `Assumptions!$I$${refs.segmentsStart + idx}`;
          const acvAvg = ((s.entryACV ?? 0) + (s.fullSuiteACV ?? 0)) / 2;
          const clientsF = `Assumptions!${L}$${refs.segmentsStart + idx}`;
          const valueF = `${clientsF}*AVERAGE(${acvCell},${acvCell2})`;
          xlFormula(ws, xlAddr(col, r), valueF, clientsC * acvAvg);
        });
        if (segTotalRow) {
          const range = segments.map((_, idx) => xlAddr(col, segStartRow + idx)).join(',');
          const totalV = segments.reduce((acc, s) => acc + (s.clientsByYear?.[i] ?? 0) * (((s.entryACV ?? 0) + (s.fullSuiteACV ?? 0)) / 2), 0);
          xlFormula(ws, xlAddr(col, segTotalRow), `SUM(${range})`, totalV);
        }

        let geoTamTotalV = 0, geoSamTotalV = 0, geoArrTotalV = 0;
        geographies.forEach((g, idx) => {
          const geoRowIdx = refs.geoStart + idx;
          const tamPct = g.tamPctOfGlobal ?? 0, cagr = g.cagr ?? 0, accessPct = g.accessiblePct ?? 0, regPrem = g.regulatoryPremiumUSDM ?? 0;
          const globalSizeV = refs.model.market?.globalMarketSizeUSDM_Y1 ?? 0;

          const tamF = i === 0
            ? `Assumptions!$C$${refs.globalSize}*Assumptions!$D$${geoRowIdx}`
            : `Assumptions!$C$${refs.globalSize}*Assumptions!$D$${geoRowIdx}*(1+Assumptions!$E$${geoRowIdx})^${i}`;
          const tamV = globalSizeV * tamPct * Math.pow(1 + cagr, i);
          xlFormula(ws, xlAddr(col, geoTamRows[idx]), tamF, tamV);
          geoTamTotalV += tamV;

          const samF = `${L}${geoTamRows[idx]}*Assumptions!$C$${refs.combinedFilter}*Assumptions!$F$${geoRowIdx}+Assumptions!$G$${geoRowIdx}`;
          const samV = tamV * refs.combinedFilterValue * accessPct + regPrem;
          xlFormula(ws, xlAddr(col, geoSamRows[idx]), samF, samV);
          geoSamTotalV += samV;

          const clientsC = g.clientsByYear?.[i] ?? 0;
          const acvC = g.acvByYear?.[i] ?? 0;
          const geoClientsCol = xlCol(8 + i); // Assumptions geo table: I-M = Y1-Y5 clients
          const geoAcvCol = xlCol(13 + i); // Assumptions geo table: N-R = Y1-Y5 ACV
          const arrF = `Assumptions!${geoClientsCol}$${geoRowIdx}*Assumptions!${geoAcvCol}$${geoRowIdx}`;
          const arrV = clientsC * acvC;
          xlFormula(ws, xlAddr(col, geoArrRows[idx]), arrF, arrV);
          geoArrTotalV += arrV;
        });
        if (geoTamTotalRow) xlFormula(ws, xlAddr(col, geoTamTotalRow), `SUM(${geographies.map((_, idx) => xlAddr(col, geoTamRows[idx])).join(',')})`, geoTamTotalV);
        if (geoSamTotalRow) xlFormula(ws, xlAddr(col, geoSamTotalRow), `SUM(${geographies.map((_, idx) => xlAddr(col, geoSamRows[idx])).join(',')})`, geoSamTotalV);
        if (geoArrTotalRow) xlFormula(ws, xlAddr(col, geoArrTotalRow), `SUM(${geographies.map((_, idx) => xlAddr(col, geoArrRows[idx])).join(',')})`, geoArrTotalV);

        const primaryArrV = tamSamSom.arrVals[i];
        const grandTotalF = geoArrTotalRow ? `'TAM SAM SOM'!${L}${tamSamSom.arrRow}+${L}${geoArrTotalRow}` : `'TAM SAM SOM'!${L}${tamSamSom.arrRow}`;
        xlFormula(ws, xlAddr(col, grandTotalRow), grandTotalF, primaryArrV + geoArrTotalV);

        for (let r = segStartRow; r < segStartRow + segments.length; r++) setFmt(ws, xlAddr(col, r), FMT_USD);
        if (segTotalRow) setFmt(ws, xlAddr(col, segTotalRow), FMT_USD);
        geoTamRows.forEach(r => setFmt(ws, xlAddr(col, r), FMT_USD_1DP));
        if (geoTamTotalRow) setFmt(ws, xlAddr(col, geoTamTotalRow), FMT_USD_1DP);
        geoSamRows.forEach(r => setFmt(ws, xlAddr(col, r), FMT_USD_1DP));
        if (geoSamTotalRow) setFmt(ws, xlAddr(col, geoSamTotalRow), FMT_USD_1DP);
        geoArrRows.forEach(r => setFmt(ws, xlAddr(col, r), FMT_USD));
        if (geoArrTotalRow) setFmt(ws, xlAddr(col, geoArrTotalRow), FMT_USD);
        setFmt(ws, xlAddr(col, grandTotalRow), FMT_USD);
      });

      ws['!cols'] = [{ wch: 2 }, { wch: 30 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }];
      return { ws };
    }

    function buildSalaryAnalysisSheet(model) {
      const aoa = [];
      const push = (row) => { aoa.push(row); return aoa.length; };
      push(['SALARY ANALYSIS — 5-year headcount and payroll build. Monthly salary (Year 1) and the annual escalation % are the blue inputs; Year 2-5 salary is a formula chained off the prior year.']);
      push([]);
      push([null, 'Role', 'Contract Type', 'Escalation %', 'HC Y1', 'HC Y2', 'HC Y3', 'HC Y4', 'HC Y5', 'Salary/mo Y1', 'Salary/mo Y2', 'Salary/mo Y3', 'Salary/mo Y4', 'Salary/mo Y5', 'Annual Cost Y1', 'Annual Cost Y2', 'Annual Cost Y3', 'Annual Cost Y4', 'Annual Cost Y5', 'Notes']);
      const roster = model.salaryRoster || [];
      const startRow = aoa.length + 1;
      roster.forEach(r => {
        const hc = r.headcountByYear?.length === 5 ? r.headcountByYear : [0, 0, 0, 0, 0];
        push([null, r.role || '', r.contractType || 'Full Time', r.annualEscalationPct ?? 0, ...hc, r.monthlySalaryY1USD ?? 0, null, null, null, null, null, null, null, null, null, r.notes || '']);
      });
      const totalRow = push([null, 'TOTAL']);

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      // Column layout: B=role(1) C=contract(2) D=escalation(3) E-I=headcount(4-8) J-N=salary/mo(9-13) O-S=annual cost(14-18) T=notes(19)
      const salaryVals = []; // [role][year] monthly salary
      const annualVals = []; // [role][year] annual cost

      roster.forEach((r, idx) => {
        const row = startRow + idx;
        const esc = r.annualEscalationPct ?? 0;
        const hc = r.headcountByYear?.length === 5 ? r.headcountByYear : [0, 0, 0, 0, 0];
        const roleSalary = [], roleAnnual = [];
        for (let y = 0; y < 5; y++) {
          const salCol = 9 + y; // J..N
          const annCol = 14 + y; // O..S
          const hcCol = 4 + y; // E..I
          let salV;
          if (y === 0) {
            salV = r.monthlySalaryY1USD ?? 0;
            ws[xlAddr(salCol, row)] = { t: 'n', v: salV };
          } else {
            const prevCol = 9 + y - 1;
            salV = roleSalary[y - 1] * (1 + esc);
            xlFormula(ws, xlAddr(salCol, row), `${xlCol(prevCol)}${row}*(1+$D${row})`, salV);
          }
          roleSalary.push(salV);
          const annV = hc[y] * salV * 12;
          xlFormula(ws, xlAddr(annCol, row), `${xlCol(hcCol)}${row}*${xlCol(salCol)}${row}*12`, annV);
          roleAnnual.push(annV);
        }
        salaryVals.push(roleSalary);
        annualVals.push(roleAnnual);

        setFmt(ws, `D${row}`, FMT_PCT);
        for (let y = 0; y < 5; y++) {
          setFmt(ws, xlAddr(4 + y, row), FMT_INT);
          setFmt(ws, xlAddr(9 + y, row), FMT_USD);
          setFmt(ws, xlAddr(14 + y, row), FMT_USD);
        }
      });

      // Totals row: headcount E-I, annual cost O-S
      for (let y = 0; y < 5; y++) {
        const hcCol = 4 + y, annCol = 14 + y;
        if (roster.length) {
          const hcRange = roster.map((_, idx) => xlAddr(hcCol, startRow + idx)).join(',');
          const annRange = roster.map((_, idx) => xlAddr(annCol, startRow + idx)).join(',');
          const hcTotal = roster.reduce((acc, r) => acc + (r.headcountByYear?.[y] ?? 0), 0);
          const annTotal = annualVals.reduce((acc, vals) => acc + vals[y], 0);
          xlFormula(ws, xlAddr(hcCol, totalRow), `SUM(${hcRange})`, hcTotal);
          xlFormula(ws, xlAddr(annCol, totalRow), `SUM(${annRange})`, annTotal);
          setFmt(ws, xlAddr(hcCol, totalRow), FMT_INT);
          setFmt(ws, xlAddr(annCol, totalRow), FMT_USD);
        }
      }

      ws['!cols'] = [{ wch: 2 }, { wch: 26 }, { wch: 12 }, { wch: 10 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 50 }];
      return { ws, totalRow, totalCostCols: [14, 15, 16, 17, 18] };
    }

    function buildExpenseAnalysisSheet(model, salaryRefs) {
      const aoa = [];
      const push = (row) => { aoa.push(row); return aoa.length; };
      push(['EXPENSE ANALYSIS — non-salary operating costs by category. Headcount-driven lines reference the Salary Analysis totals directly.']);
      push([]);
      push([null, 'Category', 'Description', 'Driver', 'Year1', 'Year2', 'Year3', 'Year4', 'Year5', 'Escalation %', 'Rate / Head', 'Notes']);

      const categories = model.expenseCategories || [];
      const subtotalRows = [];
      const lineData = []; // { row, driverType, y1, esc, rate }

      categories.forEach(cat => {
        push([null, (cat.category || '').toUpperCase()]);
        const catStartRow = aoa.length + 1;
        (cat.lineItems || []).forEach(li => {
          const row = push([null, cat.category || '', li.description || '', li.driverType || 'flat', null, null, null, null, null, li.escalationPct ?? 0, li.ratePerHead ?? 0, li.notes || '']);
          lineData.push({ row, driverType: li.driverType || 'flat', y1: li.y1AnnualUSD ?? 0, esc: li.escalationPct ?? 0, rate: li.ratePerHead ?? 0 });
        });
        const catEndRow = aoa.length;
        if (catEndRow >= catStartRow) {
          const subRow = push([null, `Subtotal — ${cat.category || ''}`]);
          subtotalRows.push({ row: subRow, start: catStartRow, end: catEndRow });
        }
        push([]);
      });

      const grandTotalRow = push([null, 'GRAND TOTAL OPERATING EXPENSES']);

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const salaryTotalRow = salaryRefs.totalRow;
      const salaryCostCols = salaryRefs.totalCostCols; // O..S (14..18) in Salary Analysis

      lineData.forEach(item => {
        for (let y = 0; y < 5; y++) {
          const col = 4 + y; // E..I
          let f, v;
          if (item.driverType === 'perHeadcount' || item.driverType === 'perNewHire') {
            const thisCol = xlCol(salaryCostCols[y] - 10); // map annual-cost col index to headcount col index (offset -10: O(14)->E(4))
            if (item.driverType === 'perHeadcount' || y === 0) {
              f = `'Salary Analysis'!${thisCol}$${salaryTotalRow}*$K${item.row}`;
              v = 0; // computed value filled in after Salary sheet totals known — approximated below
            } else {
              const prevCol = xlCol(salaryCostCols[y - 1] - 10);
              f = `('Salary Analysis'!${thisCol}$${salaryTotalRow}-'Salary Analysis'!${prevCol}$${salaryTotalRow})*$K${item.row}`;
              v = 0;
            }
          } else if (item.driverType === 'escalating') {
            if (y === 0) { ws[xlAddr(col, item.row)] = { t: 'n', v: item.y1 }; continue; }
            const prevCol = 4 + y - 1;
            f = `${xlCol(prevCol)}${item.row}*(1+$J${item.row})`;
            v = 0; // running chain value patched in during the second pass below
          } else {
            // flat
            ws[xlAddr(col, item.row)] = { t: 'n', v: item.y1 };
            continue;
          }
          xlFormula(ws, xlAddr(col, item.row), f, v);
        }
        for (let y = 0; y < 5; y++) setFmt(ws, xlAddr(4 + y, item.row), FMT_USD);
        setFmt(ws, `J${item.row}`, FMT_PCT);
        setFmt(ws, `K${item.row}`, FMT_USD);
      });

      // Second pass: fill accurate cached values for escalating and headcount-driven cells
      // now that Salary Analysis headcount totals are known from model.salaryRoster.
      const hcTotalsByYear = [0, 0, 0, 0, 0];
      (model.salaryRoster || []).forEach(r => {
        const hc = r.headcountByYear?.length === 5 ? r.headcountByYear : [0, 0, 0, 0, 0];
        hc.forEach((h, y) => { hcTotalsByYear[y] += h; });
      });
      lineData.forEach(item => {
        let prevEsc = item.y1;
        for (let y = 0; y < 5; y++) {
          const col = 4 + y;
          const addr = xlAddr(col, item.row);
          if (item.driverType === 'perHeadcount') {
            const v = hcTotalsByYear[y] * item.rate;
            if (ws[addr]) ws[addr].v = v;
          } else if (item.driverType === 'perNewHire') {
            const newHires = y === 0 ? hcTotalsByYear[0] : Math.max(0, hcTotalsByYear[y] - hcTotalsByYear[y - 1]);
            const v = newHires * item.rate;
            if (ws[addr]) ws[addr].v = v;
          } else if (item.driverType === 'escalating' && y > 0) {
            prevEsc = prevEsc * (1 + item.esc);
            if (ws[addr]) ws[addr].v = prevEsc;
          }
        }
      });

      subtotalRows.forEach(({ row, start, end }) => {
        for (let y = 0; y < 5; y++) {
          const col = 4 + y;
          const range = `${xlAddr(col, start)}:${xlAddr(col, end)}`;
          let total = 0;
          for (let r = start; r <= end; r++) {
            const addr = xlAddr(col, r);
            total += ws[addr]?.v ?? 0;
          }
          xlFormula(ws, xlAddr(col, row), `SUM(${range})`, total);
          setFmt(ws, xlAddr(col, row), FMT_USD);
        }
      });

      for (let y = 0; y < 5; y++) {
        const col = 4 + y;
        const refList = subtotalRows.map(s => xlAddr(col, s.row));
        const total = subtotalRows.reduce((acc, s) => acc + (ws[xlAddr(col, s.row)]?.v ?? 0), 0);
        xlFormula(ws, xlAddr(col, grandTotalRow), `SUM(${refList.join(',')})`, total);
        setFmt(ws, xlAddr(col, grandTotalRow), FMT_USD);
      }

      ws['!cols'] = [{ wch: 2 }, { wch: 24 }, { wch: 34 }, { wch: 12 }, { wch: 13 }, { wch: 13 }, { wch: 13 }, { wch: 13 }, { wch: 13 }, { wch: 11 }, { wch: 11 }, { wch: 50 }];
      return { ws, grandTotalRow, grandTotalCols: [4, 5, 6, 7, 8] };
    }

    function buildProfitLossSheet(model, tamSamSom, salaryRefs, expenseRefs, assumptionsRefs) {
      const aoa = [];
      const push = (row) => { aoa.push(row); return aoa.length; };
      push(['PROFIT & LOSS — revenue pulled from TAM SAM SOM; costs pulled from Salary Analysis and Expense Analysis; every cell below is a live formula.']);
      push([]);
      push([null, 'Line Item', 'Y1', 'Y2', 'Y3', 'Y4', 'Y5']);
      const rRevenue = push([null, 'Revenue']);
      const rCogs = push([null, 'Cost of Goods Sold (COGS)']);
      const rGrossProfit = push([null, 'GROSS PROFIT']);
      const rSalaries = push([null, 'Salaries & People Costs']);
      const rOpex = push([null, 'Operating Expenses (non-salary)']);
      const rTotalCosts = push([null, 'TOTAL OPERATING COSTS']);
      const rEbitda = push([null, 'EBITDA']);
      const rEbitdaMargin = push([null, '  EBITDA Margin %']);
      push([]);
      push([null, 'CASH FLOW']);
      const rNetCash = push([null, 'Net Cash Flow']);
      const rCumCash = push([null, 'Cumulative Cash Position']);
      push([]);
      push([null, 'UNIT ECONOMICS']);
      const rAcv = push([null, 'Blended ACV (USD/year)']);
      const rMrr = push([null, 'MRR per Client']);
      const rCac = push([null, 'CAC']);
      const rLtv = push([null, 'LTV (ACV × Gross Margin ÷ Churn)']);
      const rLtvCac = push([null, '  LTV : CAC']);
      const rPayback = push([null, '  CAC Payback (months)']);
      push([]);
      push([null, 'FUNDING & VALUATION']);
      const rPreMoney = push([null, 'Pre-Money Valuation (Revenue × Multiple)']);
      const rRaise = push([null, 'Recommended Raise']);
      const rPostMoney = push([null, 'Post-Money Valuation']);
      const rFundingGap = push([null, 'Funding Gap (if cumulative cash negative)']);

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const margin = model.grossMargin ?? 0;
      const churn = model.churnRate ?? 0;
      const ltvHorizon = model.funding?.ltvHorizonYears ?? 3;

      let cumCash = 0;
      YEAR_COLS.forEach((col, i) => {
        const L = xlCol(col);
        const revV = tamSamSom.arrVals[i];
        xlFormula(ws, xlAddr(col, rRevenue), `'TAM SAM SOM'!${L}${tamSamSom.arrRow}`, revV);

        const cogsV = -revV * (1 - margin);
        xlFormula(ws, xlAddr(col, rCogs), `-${L}${rRevenue}*(1-Assumptions!$C$${assumptionsRefs.margin})`, cogsV);

        const gpV = revV + cogsV;
        xlFormula(ws, xlAddr(col, rGrossProfit), `${L}${rRevenue}+${L}${rCogs}`, gpV);

        const salaryCol = xlCol(salaryRefs.totalCostCols[i]);
        const salV = (model.salaryRoster || []).reduce((acc, r) => {
          const hc = r.headcountByYear?.[i] ?? 0;
          let sal = r.monthlySalaryY1USD ?? 0;
          for (let y = 0; y < i; y++) sal *= (1 + (r.annualEscalationPct ?? 0));
          return acc + hc * sal * 12;
        }, 0);
        xlFormula(ws, xlAddr(col, rSalaries), `'Salary Analysis'!${salaryCol}$${salaryRefs.totalRow}`, salV);

        const opexCol = xlCol(expenseRefs.grandTotalCols[i]);
        // Recompute opex total in JS for the cached value (mirrors buildExpenseAnalysisSheet's own math).
        let opexV = 0;
        (model.expenseCategories || []).forEach(cat => {
          (cat.lineItems || []).forEach(li => {
            const dt = li.driverType || 'flat';
            if (dt === 'flat') opexV += li.y1AnnualUSD ?? 0;
            else if (dt === 'escalating') opexV += (li.y1AnnualUSD ?? 0) * Math.pow(1 + (li.escalationPct ?? 0), i);
            else if (dt === 'perHeadcount' || dt === 'perNewHire') {
              const hcTotals = [0, 0, 0, 0, 0];
              (model.salaryRoster || []).forEach(r => { (r.headcountByYear || []).forEach((h, y) => { hcTotals[y] += h; }); });
              if (dt === 'perHeadcount') opexV += hcTotals[i] * (li.ratePerHead ?? 0);
              else opexV += (i === 0 ? hcTotals[0] : Math.max(0, hcTotals[i] - hcTotals[i - 1])) * (li.ratePerHead ?? 0);
            }
          });
        });
        xlFormula(ws, xlAddr(col, rOpex), `'Expense Analysis'!${opexCol}$${expenseRefs.grandTotalRow}`, opexV);

        const totalCostsV = salV + opexV;
        xlFormula(ws, xlAddr(col, rTotalCosts), `${L}${rSalaries}+${L}${rOpex}`, totalCostsV);

        const ebitdaV = gpV - totalCostsV;
        xlFormula(ws, xlAddr(col, rEbitda), `${L}${rGrossProfit}-${L}${rTotalCosts}`, ebitdaV);
        xlFormula(ws, xlAddr(col, rEbitdaMargin), `IFERROR(${L}${rEbitda}/${L}${rRevenue},0)`, revV ? ebitdaV / revV : 0);

        xlFormula(ws, xlAddr(col, rNetCash), `${L}${rEbitda}`, ebitdaV);
        cumCash += ebitdaV;
        const cumF = i === 0 ? `${L}${rNetCash}` : `${xlCol(YEAR_COLS[i - 1])}${rCumCash}+${L}${rNetCash}`;
        xlFormula(ws, xlAddr(col, rCumCash), cumF, cumCash);

        const acvC = model.blendedACVByYear?.[i] ?? 0;
        xlFormula(ws, xlAddr(col, rAcv), `Assumptions!${L}$${assumptionsRefs.acv}`, acvC);
        xlFormula(ws, xlAddr(col, rMrr), `${L}${rAcv}/12`, acvC / 12);

        const cacC = model.funding?.cacByYear?.[i] ?? 0;
        xlFormula(ws, xlAddr(col, rCac), `Assumptions!${L}$${assumptionsRefs.cac}`, cacC);

        const ltvV = churn ? (acvC * margin) / churn : acvC * ltvHorizon * margin;
        const ltvF = `IFERROR(${L}${rAcv}*Assumptions!$C$${assumptionsRefs.margin}/Assumptions!$C$${assumptionsRefs.churn},${L}${rAcv}*${ltvHorizon}*Assumptions!$C$${assumptionsRefs.margin})`;
        xlFormula(ws, xlAddr(col, rLtv), ltvF, ltvV);
        xlFormula(ws, xlAddr(col, rLtvCac), `IFERROR(${L}${rLtv}/${L}${rCac},0)`, cacC ? ltvV / cacC : 0);
        const mrrV = acvC / 12;
        xlFormula(ws, xlAddr(col, rPayback), `IFERROR(${L}${rCac}/(${L}${rMrr}*Assumptions!$C$${assumptionsRefs.margin}),0)`, (mrrV * margin) ? cacC / (mrrV * margin) : 0);

        const preMoneyV = revV * (model.funding?.revenueMultiple ?? 0);
        xlFormula(ws, xlAddr(col, rPreMoney), `${L}${rRevenue}*Assumptions!$C$${assumptionsRefs.revenueMultiple}`, preMoneyV);
        const equityPct = model.funding?.equityPctForRaise ?? 0;
        const raiseV = Math.max(preMoneyV * (equityPct / (1 - equityPct)), model.funding?.minimumRaiseUSD ?? 0);
        xlFormula(ws, xlAddr(col, rRaise), `MAX(${L}${rPreMoney}*Assumptions!$C$${assumptionsRefs.equityPct}/(1-Assumptions!$C$${assumptionsRefs.equityPct}),Assumptions!$C$${assumptionsRefs.minRaise})`, raiseV);
        xlFormula(ws, xlAddr(col, rPostMoney), `${L}${rPreMoney}+${L}${rRaise}`, preMoneyV + raiseV);
        const gapV = Math.max(0, -cumCash);
        xlFormula(ws, xlAddr(col, rFundingGap), `MAX(0,-${L}${rCumCash})`, gapV);

        [rRevenue, rCogs, rGrossProfit, rSalaries, rOpex, rTotalCosts, rEbitda, rNetCash, rCumCash, rAcv, rMrr, rCac, rLtv, rPreMoney, rRaise, rPostMoney, rFundingGap]
          .forEach(r => setFmt(ws, xlAddr(col, r), FMT_USD));
        setFmt(ws, xlAddr(col, rEbitdaMargin), FMT_PCT);
        setFmt(ws, xlAddr(col, rLtvCac), FMT_MULT);
        setFmt(ws, xlAddr(col, rPayback), FMT_NUM_1DP);
      });

      ws['!cols'] = [{ wch: 2 }, { wch: 42 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }];
      return { ws };
    }

    function buildFinancialWorkbook(model) {
      const assumptions = buildAssumptionsSheet(model);
      const tamSamSom = buildTamSamSomSheet(assumptions.refs);
      const revenueBridge = buildRevenueBridgeSheet(assumptions.refs);
      const segmentsGeo = buildSegmentsGeoSheet(assumptions.refs, tamSamSom);
      const salary = buildSalaryAnalysisSheet(model);
      const expense = buildExpenseAnalysisSheet(model, salary);
      const pl = buildProfitLossSheet(model, tamSamSom, salary, expense, assumptions.refs);
      return { assumptions, tamSamSom, revenueBridge, segmentsGeo, salary, expense, pl };
    }

    function generateFinancialModelExcel(model, milestone, intake, research) {
      const wb = XLSX.utils.book_new();
      const sheets = buildFinancialWorkbook(model);
      XLSX.utils.book_append_sheet(wb, sheets.assumptions.ws, 'Assumptions');
      XLSX.utils.book_append_sheet(wb, sheets.tamSamSom.ws, 'TAM SAM SOM');
      XLSX.utils.book_append_sheet(wb, sheets.revenueBridge.ws, 'Revenue Bridge');
      XLSX.utils.book_append_sheet(wb, sheets.segmentsGeo.ws, 'Segments & Geographies');
      XLSX.utils.book_append_sheet(wb, sheets.salary.ws, 'Salary Analysis');
      XLSX.utils.book_append_sheet(wb, sheets.expense.ws, 'Expense Analysis');
      XLSX.utils.book_append_sheet(wb, sheets.pl.ws, 'Profit & Loss');

      const dateStr = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      const notesAoa = [
        ['MarketEdge — Financial Model'],
        ['Prepared for', [intake?.industry, intake?.market].filter(Boolean).join(' — ')],
        ['Date', dateStr],
        ['Client brief', intake?.brief || ''],
        [''],
        ['This is a fully formula-linked model: every sheet after Assumptions computes live from Assumptions cells (or, for Salary/Expense/P&L, from each other). Change a blue input cell and the workbook recalculates.'],
        [AI_DISCLAIMER],
      ];
      const notesWs = XLSX.utils.aoa_to_sheet(notesAoa);
      notesWs['!cols'] = [{ wch: 22 }, { wch: 80 }];
      XLSX.utils.book_append_sheet(wb, notesWs, 'Notes');
      appendSourcesSheet(wb, research, 'MarketEdge — Research Sources');

      XLSX.writeFile(wb, `MarketEdge-${fileSafe(milestone.name)}-Model.xlsx`);
    }

    // Reads the headline figures straight out of the same sheet builders the Excel export
    // uses, so every report, the business plan and the deck quote exactly the numbers the
    // client sees in the workbook.
    function sheetRowValues(ws, labelPrefix, cols = YEAR_COLS) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let r = range.s.r + 1; r <= range.e.r + 1; r++) {
        const label = ws[`B${r}`]?.v;
        if (typeof label === 'string' && label.trim().toLowerCase().startsWith(labelPrefix.trim().toLowerCase())) {
          return cols.map(c => Number(ws[xlAddr(c, r)]?.v) || 0);
        }
      }
      return cols.map(() => 0);
    }

    function computeFinancialSummary(model) {
      if (!model) return null;
      try {
        const { tamSamSom, salary, pl } = buildFinancialWorkbook(model);
        const ts = tamSamSom.ws, p = pl.ws;
        const ebitda = sheetRowValues(p, 'EBITDA');
        const cumulativeCash = sheetRowValues(p, 'Cumulative Cash');
        const breakEven = ebitda.findIndex(v => v > 0);
        return {
          revenue: sheetRowValues(p, 'Revenue'),
          clients: sheetRowValues(ts, 'Paying Clients'),
          acv: sheetRowValues(ts, 'Blended ACV'),
          grossProfit: sheetRowValues(p, 'GROSS PROFIT'),
          totalCosts: sheetRowValues(p, 'TOTAL OPERATING COSTS'),
          ebitda,
          ebitdaMargin: sheetRowValues(p, '  EBITDA Margin'),
          cumulativeCash,
          headcount: [4, 5, 6, 7, 8].map(c => Number(salary.ws[xlAddr(c, salary.totalRow)]?.v) || 0),
          tamM: sheetRowValues(ts, 'TAM'),
          samM: sheetRowValues(ts, 'SAM —'),
          somM: sheetRowValues(ts, 'SOM —'),
          ltvCac: sheetRowValues(p, '  LTV : CAC'),
          cacPaybackMonths: sheetRowValues(p, '  CAC Payback'),
          grossMargin: Number(model.grossMargin) || 0,
          churnRate: Number(model.churnRate) || 0,
          recommendedRaise: sheetRowValues(p, 'Recommended Raise')[0],
          preMoneyY1: sheetRowValues(p, 'Pre-Money')[0],
          peakFundingGap: Math.max(0, ...cumulativeCash.map(v => -v)),
          breakEvenYear: breakEven === -1 ? null : breakEven + 1,
          primaryMarketName: model.market?.primaryMarketName || '',
        };
      } catch (e) {
        reportClientError('financial-summary', e);
        return null;
      }
    }

    // ============ PITCH DECK (PPTX) ============
    // 16:9 deck in the style of the reference strategy deck: navy titles, light card rows
    // with an accent bar, section dividers, big-number callouts and native charts/tables.
    // Every chart and financial figure is drawn from the financial model, not from AI text.
    const DECK = {
      navy: '1A3C5E', body: '2E2E2E', card: 'F5F5F5', accent: 'E07B3F', teal: '0D5C63', blue: '2E6DA4',
      muted: '8A8F98', light: 'CADCFC', white: 'FFFFFF', titleFont: 'Calibri Light', bodyFont: 'Calibri',
    };
    const YEAR_LABELS = ['Y1', 'Y2', 'Y3', 'Y4', 'Y5'];
    const toM = (v) => Math.round(((Number(v) || 0) / 1e6) * 100) / 100;

    function deckTitle(slide, text) {
      slide.addText(text || '', { x: 0.5, y: 0.28, w: 9.0, h: 0.6, fontFace: DECK.titleFont, fontSize: 22, color: DECK.navy, bold: false, valign: 'middle', fit: 'shrink' });
    }

    function deckFooter(slide, footer, n, total) {
      slide.addText(footer, { x: 0.5, y: 5.22, w: 7.5, h: 0.3, fontFace: DECK.bodyFont, fontSize: 8, color: 'AAAAAA' });
      slide.addText(`${n} / ${total}`, { x: 8.7, y: 5.22, w: 0.8, h: 0.3, fontFace: DECK.bodyFont, fontSize: 8, color: 'AAAAAA', align: 'right' });
    }

    function deckTakeaway(slide, text) {
      if (!text) return;
      slide.addShape('rect', { x: 0.5, y: 4.62, w: 9.0, h: 0.48, fill: { color: 'FFF3E8' }, line: { color: 'FFF3E8' } });
      slide.addShape('rect', { x: 0.5, y: 4.62, w: 0.06, h: 0.48, fill: { color: DECK.accent }, line: { color: DECK.accent } });
      slide.addText(text, { x: 0.7, y: 4.62, w: 8.7, h: 0.48, fontFace: DECK.bodyFont, fontSize: 11, color: DECK.body, valign: 'middle', fit: 'shrink' });
    }

    function deckStatColumn(slide, stats, x, w) {
      stats.forEach((st, i) => {
        const y = 1.05 + i * 1.15;
        slide.addShape('rect', { x, y, w, h: 1.0, fill: { color: DECK.card }, line: { color: DECK.card } });
        slide.addText(st.value, { x: x + 0.15, y: y + 0.05, w: w - 0.3, h: 0.55, fontFace: DECK.bodyFont, fontSize: 24, bold: true, color: DECK.accent, fit: 'shrink' });
        slide.addText(st.label, { x: x + 0.15, y: y + 0.58, w: w - 0.3, h: 0.36, fontFace: DECK.bodyFont, fontSize: 10, color: DECK.body, fit: 'shrink' });
      });
    }

    const chartBase = {
      catAxisLabelFontFace: 'Calibri', catAxisLabelFontSize: 10, catAxisLabelColor: '555555',
      valAxisLabelFontFace: 'Calibri', valAxisLabelFontSize: 9, valAxisLabelColor: '777777',
      valGridLine: { color: 'E6E6E6', size: 0.5 }, dataLabelFontFace: 'Calibri', dataLabelFontSize: 9,
      legendFontFace: 'Calibri', legendFontSize: 10,
    };

    function renderDeckChart(slide, sl, fs) {
      if (!fs) {
        slide.addText('Financial model not available — generate the Financial Analysis milestone first.', { x: 0.5, y: 2.2, w: 9, h: 0.6, fontSize: 14, color: DECK.muted, align: 'center' });
        return;
      }
      const area = { x: 0.5, y: 1.0, w: 6.2, h: 3.5 };
      if (sl.chart === 'arr') {
        slide.addChart('bar', [{ name: 'ARR ($M)', labels: YEAR_LABELS, values: fs.revenue.map(toM) }],
          { ...area, ...chartBase, barDir: 'col', chartColors: [DECK.accent], showValue: true, dataLabelFormatCode: '$0.0"M"', valAxisLabelFormatCode: '$0.0"M"', showLegend: false });
        const growth = fs.revenue[0] > 0 ? Math.pow(fs.revenue[4] / fs.revenue[0], 1 / 4) - 1 : null;
        deckStatColumn(slide, [
          { value: fmtMoney(fs.revenue[4]), label: 'Year 5 ARR' },
          { value: String(Math.round(fs.clients[4])), label: 'Paying clients by Year 5' },
          { value: growth != null ? `${Math.round(growth * 100)}%` : '—', label: 'ARR CAGR, Year 1 → Year 5' },
        ], 7.0, 2.5);
      } else if (sl.chart === 'pnl') {
        slide.addChart('bar', [
          { name: 'Revenue', labels: YEAR_LABELS, values: fs.revenue.map(toM) },
          { name: 'Operating costs', labels: YEAR_LABELS, values: fs.totalCosts.map(toM) },
          { name: 'EBITDA', labels: YEAR_LABELS, values: fs.ebitda.map(toM) },
        ], { ...area, ...chartBase, barDir: 'col', barGrouping: 'clustered', chartColors: [DECK.navy, 'B8C2CC', DECK.accent], valAxisLabelFormatCode: '$0.0"M"', showLegend: true, legendPos: 'b' });
        deckStatColumn(slide, [
          { value: fs.breakEvenYear ? `Year ${fs.breakEvenYear}` : 'Beyond Y5', label: 'EBITDA break-even' },
          { value: fmtPctNum(fs.ebitdaMargin[4]), label: 'Year 5 EBITDA margin' },
          { value: fmtPctNum(fs.grossMargin), label: 'Gross margin' },
        ], 7.0, 2.5);
      } else if (sl.chart === 'cash') {
        slide.addChart('line', [{ name: 'Cumulative cash ($M)', labels: YEAR_LABELS, values: fs.cumulativeCash.map(toM) }],
          { ...area, ...chartBase, chartColors: [DECK.teal], lineSize: 3, lineDataSymbol: 'circle', lineDataSymbolSize: 8, showValue: true, dataLabelFormatCode: '$0.0"M"', valAxisLabelFormatCode: '$0.0"M"', showLegend: false });
        deckStatColumn(slide, [
          { value: fmtMoney(fs.peakFundingGap), label: 'Peak funding gap' },
          { value: fmtMoney(fs.recommendedRaise), label: 'Recommended raise' },
          { value: fmtMoney(fs.cumulativeCash[4]), label: 'Cash position, end of Year 5' },
        ], 7.0, 2.5);
      } else if (sl.chart === 'headcount') {
        slide.addChart('bar', [{ name: 'Headcount', labels: YEAR_LABELS, values: fs.headcount }],
          { ...area, ...chartBase, barDir: 'col', chartColors: [DECK.blue], showValue: true, showLegend: false });
        deckStatColumn(slide, [
          { value: String(Math.round(fs.headcount[0])), label: 'Team in Year 1' },
          { value: String(Math.round(fs.headcount[4])), label: 'Team in Year 5' },
          { value: fs.headcount[4] ? fmtMoney(fs.revenue[4] / fs.headcount[4]) : '—', label: 'ARR per employee, Year 5' },
        ], 7.0, 2.5);
      }
      deckTakeaway(slide, sl.takeaway);
    }

    function renderDeckTable(slide, columns, rows, y = 1.05, h) {
      if (!columns?.length) return;
      const colW = 9.0 / columns.length;
      const header = columns.map(c => ({ text: c, options: { bold: true, color: DECK.white, fill: { color: DECK.navy } } }));
      const body = rows.map((r, i) => r.map(c => ({ text: String(c ?? ''), options: { fill: { color: i % 2 ? 'FFFFFF' : DECK.card } } })));
      slide.addTable([header, ...body], {
        x: 0.5, y, w: 9.0, colW: Array(columns.length).fill(colW), h,
        fontFace: DECK.bodyFont, fontSize: 10, color: DECK.body, valign: 'middle',
        border: { type: 'solid', pt: 0.5, color: 'E2E2E2' }, margin: 0.06, autoPage: false,
      });
    }

    async function generatePitchDeckPptx(deck, fs, research, businessName) {
      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';
      const company = deck.companyName || businessName || 'Company';
      pptx.title = `${company} — Investor Presentation`;
      pptx.company = company;
      const slides = [...deck.slides];

      const deckText = JSON.stringify(slides);
      const cited = (research?.sources || []).filter(s => deckText.includes(`[${s.id}]`));
      if (cited.length) slides.push({ type: 'sources' });

      const total = slides.length;
      const footer = `${company.toUpperCase()}  |  ${deck.tagline || 'Investor Presentation'}  |  Confidential`;
      const dateStr = new Date().toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

      slides.forEach((sl, idx) => {
        const n = idx + 1;
        const slide = pptx.addSlide();
        const dark = sl.type === 'title' || sl.type === 'section' || sl.type === 'closing';
        slide.background = { color: dark ? DECK.navy : DECK.white };

        switch (sl.type) {
          case 'title':
            slide.addShape('rect', { x: 0.6, y: 1.55, w: 0.1, h: 1.6, fill: { color: DECK.accent }, line: { color: DECK.accent } });
            slide.addText(sl.title || company, { x: 0.9, y: 1.45, w: 8.5, h: 0.95, fontFace: DECK.titleFont, fontSize: 40, bold: true, color: DECK.white, fit: 'shrink' });
            slide.addText(sl.subtitle || deck.tagline || '', { x: 0.9, y: 2.4, w: 8.5, h: 0.8, fontFace: DECK.bodyFont, fontSize: 18, color: DECK.light, fit: 'shrink' });
            slide.addText(`Confidential  |  ${dateStr}`, { x: 0.9, y: 4.6, w: 8, h: 0.35, fontFace: DECK.bodyFont, fontSize: 11, color: 'AAB7C4' });
            return;
          case 'section':
            slide.addText(sl.number || String(n).padStart(2, '0'), { x: 0.9, y: 1.4, w: 3, h: 1.2, fontFace: DECK.titleFont, fontSize: 60, bold: true, color: DECK.accent });
            slide.addText(sl.title, { x: 0.9, y: 2.6, w: 8.2, h: 0.9, fontFace: DECK.titleFont, fontSize: 32, color: DECK.white, fit: 'shrink' });
            slide.addText(`${n} / ${total}`, { x: 8.7, y: 5.22, w: 0.8, h: 0.3, fontSize: 8, color: '8FA3B8', align: 'right' });
            return;
          case 'closing':
            slide.addText(sl.title || 'Next Steps', { x: 0.9, y: 0.6, w: 8.2, h: 0.8, fontFace: DECK.titleFont, fontSize: 32, color: DECK.white });
            slide.addText((sl.points || []).map((p, i) => ({ text: `${i + 1}.  ${p}`, options: { breakLine: true } })), {
              x: 0.9, y: 1.6, w: 8.2, h: 3.2, fontFace: DECK.bodyFont, fontSize: 15, color: DECK.white, paraSpaceAfter: 10, valign: 'top', fit: 'shrink',
            });
            slide.addText(`${company.toUpperCase()}  |  Confidential`, { x: 0.9, y: 5.15, w: 6, h: 0.3, fontSize: 9, color: '8FA3B8' });
            return;
          case 'cards': {
            deckTitle(slide, sl.title);
            const cards = sl.cards || [];
            const gap = 0.12;
            const h = Math.min(0.95, (4.1 - gap * (cards.length - 1)) / Math.max(1, cards.length));
            cards.forEach((c, i) => {
              const y = 1.0 + i * (h + gap);
              slide.addShape('rect', { x: 0.5, y, w: 9.0, h, fill: { color: DECK.card }, line: { color: DECK.card } });
              slide.addShape('rect', { x: 0.5, y, w: 0.06, h, fill: { color: DECK.accent }, line: { color: DECK.accent } });
              slide.addText(c.label, { x: 0.75, y, w: 2.0, h, fontFace: DECK.bodyFont, fontSize: 13, bold: true, color: DECK.navy, valign: 'middle', fit: 'shrink' });
              slide.addText(c.text, { x: 2.75, y, w: 6.6, h, fontFace: DECK.bodyFont, fontSize: 11.5, color: DECK.body, valign: 'middle', fit: 'shrink' });
            });
            break;
          }
          case 'bigNumbers': {
            deckTitle(slide, sl.title);
            const stats = sl.stats || [];
            const w = (9.0 - 0.25 * (stats.length - 1)) / Math.max(1, stats.length);
            stats.forEach((st, i) => {
              const x = 0.5 + i * (w + 0.25);
              slide.addShape('rect', { x, y: 1.2, w, h: 2.4, fill: { color: DECK.card }, line: { color: DECK.card } });
              slide.addShape('rect', { x, y: 1.2, w, h: 0.06, fill: { color: DECK.accent }, line: { color: DECK.accent } });
              slide.addText(st.value, { x, y: 1.45, w, h: 1.0, fontFace: DECK.bodyFont, fontSize: 40, bold: true, color: DECK.accent, align: 'center', fit: 'shrink' });
              slide.addText(st.label, { x: x + 0.15, y: 2.5, w: w - 0.3, h: 1.0, fontFace: DECK.bodyFont, fontSize: 12, color: DECK.body, align: 'center', valign: 'top', fit: 'shrink' });
            });
            deckTakeaway(slide, sl.note);
            break;
          }
          case 'bullets':
            deckTitle(slide, sl.title);
            slide.addText((sl.bullets || []).map(b => ({ text: b, options: { bullet: { code: '25A0' }, breakLine: true } })), {
              x: 0.5, y: 1.05, w: sl.callout ? 6.1 : 9.0, h: 3.9, fontFace: DECK.bodyFont, fontSize: 14, color: DECK.body, paraSpaceAfter: 9, valign: 'top', fit: 'shrink',
            });
            if (sl.callout) {
              slide.addShape('rect', { x: 6.85, y: 1.1, w: 2.65, h: 3.7, fill: { color: DECK.navy }, line: { color: DECK.navy } });
              slide.addText(sl.callout, { x: 7.0, y: 1.2, w: 2.35, h: 3.5, fontFace: DECK.bodyFont, fontSize: 15, bold: true, color: DECK.white, valign: 'middle', fit: 'shrink' });
            }
            break;
          case 'table':
            deckTitle(slide, sl.title);
            renderDeckTable(slide, sl.columns, sl.rows || []);
            break;
          case 'chart':
            deckTitle(slide, sl.title);
            renderDeckChart(slide, sl, fs);
            break;
          case 'marketSize': {
            deckTitle(slide, sl.title);
            if (!fs) { renderDeckChart(slide, sl, null); break; }
            const tiers = [
              { k: 'TAM', label: 'Total addressable market', y1: fs.tamM[0], y5: fs.tamM[4], color: DECK.navy, w: 9.0 },
              { k: 'SAM', label: 'Serviceable addressable market', y1: fs.samM[0], y5: fs.samM[4], color: DECK.blue, w: 7.2 },
              { k: 'SOM', label: 'Obtainable — our ARR', y1: fs.somM[0], y5: fs.somM[4], color: DECK.accent, w: 5.4 },
            ];
            tiers.forEach((t, i) => {
              const y = 1.05 + i * 1.12;
              const x = 0.5 + (9.0 - t.w) / 2;
              slide.addShape('rect', { x, y, w: t.w, h: 0.98, fill: { color: t.color }, line: { color: t.color } });
              slide.addText([
                { text: `${t.k}  `, options: { bold: true, fontSize: 18 } },
                { text: `${fmtMillions(t.y1)} → ${fmtMillions(t.y5)}`, options: { fontSize: 18, breakLine: true } },
                { text: `${t.label}, Year 1 → Year 5`, options: { fontSize: 10.5 } },
              ], { x, y, w: t.w, h: 0.98, fontFace: DECK.bodyFont, color: DECK.white, align: 'center', valign: 'middle' });
            });
            deckTakeaway(slide, sl.takeaway);
            break;
          }
          case 'unitEconomics': {
            deckTitle(slide, sl.title);
            if (!fs) { renderDeckChart(slide, sl, null); break; }
            const stats = [
              { value: `${fs.ltvCac[0].toFixed(1)}x`, label: 'LTV : CAC at launch' },
              { value: `${fs.ltvCac[4].toFixed(1)}x`, label: 'LTV : CAC by Year 5' },
              { value: `${fs.cacPaybackMonths[0].toFixed(0)} mo`, label: 'CAC payback, Year 1' },
              { value: fmtPctNum(fs.grossMargin), label: 'Gross margin' },
            ];
            const w = (9.0 - 0.25 * 3) / 4;
            stats.forEach((st, i) => {
              const x = 0.5 + i * (w + 0.25);
              slide.addShape('rect', { x, y: 1.0, w, h: 1.25, fill: { color: DECK.card }, line: { color: DECK.card } });
              slide.addText(st.value, { x, y: 1.05, w, h: 0.7, fontSize: 28, bold: true, color: DECK.accent, align: 'center', fontFace: DECK.bodyFont });
              slide.addText(st.label, { x, y: 1.72, w, h: 0.45, fontSize: 10.5, color: DECK.body, align: 'center', fontFace: DECK.bodyFont });
            });
            renderDeckTable(slide, ['', ...YEAR_LABELS], [
              ['Blended ACV', ...fs.acv.map(fmtMoney)],
              ['LTV : CAC', ...fs.ltvCac.map(v => `${v.toFixed(1)}x`)],
              ['CAC payback (months)', ...fs.cacPaybackMonths.map(v => v.toFixed(1))],
            ], 2.45);
            deckTakeaway(slide, sl.takeaway);
            break;
          }
          case 'ask': {
            deckTitle(slide, sl.title);
            slide.addShape('rect', { x: 0.5, y: 1.0, w: 3.0, h: 1.5, fill: { color: DECK.navy }, line: { color: DECK.navy } });
            slide.addText([
              { text: 'RAISING', options: { fontSize: 11, color: DECK.light, breakLine: true } },
              { text: fs ? fmtMoney(fs.recommendedRaise) : 'See model', options: { fontSize: 34, bold: true, color: DECK.white } },
            ], { x: 0.65, y: 1.05, w: 2.7, h: 1.4, fontFace: DECK.bodyFont, valign: 'middle' });
            if (fs) slide.addText(`At ${fmtMoney(fs.preMoneyY1)} pre-money · covers a ${fmtMoney(fs.peakFundingGap)} peak funding gap`, { x: 0.5, y: 2.55, w: 3.0, h: 0.6, fontSize: 10, color: DECK.muted, fontFace: DECK.bodyFont, fit: 'shrink' });
            const uses = (sl.useOfFunds || []).filter(u => u.pct > 0);
            if (uses.length) {
              slide.addChart('doughnut', [{ name: 'Use of funds', labels: uses.map(u => u.label), values: uses.map(u => u.pct) }], {
                x: 3.6, y: 0.95, w: 3.0, h: 3.6, holeSize: 55, showPercent: true, showLegend: true, legendPos: 'b', legendFontSize: 9, dataLabelFontSize: 9,
                chartColors: [DECK.navy, DECK.accent, DECK.blue, DECK.teal, 'B8C2CC', 'E8B07A'], dataLabelColor: DECK.white,
              });
            }
            slide.addText('What this raise achieves', { x: 6.8, y: 1.0, w: 2.7, h: 0.4, fontSize: 13, bold: true, color: DECK.navy, fontFace: DECK.bodyFont });
            slide.addText((sl.milestones || []).map(m => ({ text: m, options: { bullet: { code: '25A0' }, breakLine: true } })), {
              x: 6.8, y: 1.4, w: 2.7, h: 3.1, fontSize: 11.5, color: DECK.body, fontFace: DECK.bodyFont, paraSpaceAfter: 6, valign: 'top', fit: 'shrink',
            });
            break;
          }
          case 'sources':
            deckTitle(slide, 'Sources');
            slide.addText(cited.slice(0, 14).map(s => ({ text: `[${s.id}] ${s.title} — ${s.url}`, options: { breakLine: true, hyperlink: safeHref(s.url) ? { url: s.url } : undefined } })), {
              x: 0.5, y: 1.0, w: 9.0, h: 4.0, fontSize: 9, color: DECK.body, fontFace: DECK.bodyFont, paraSpaceAfter: 3, valign: 'top', fit: 'shrink',
            });
            break;
          default:
            deckTitle(slide, sl.title);
        }
        deckFooter(slide, footer, n, total);
      });

      await pptx.writeFile({ fileName: `${fileSafe(company)}-Pitch-Deck.pptx` });
    }

    function computeReportSignature(sow, intake) {
      return JSON.stringify({ sow, intake });
    }
    const REPORT_CACHE_VERSION = 'report-v1';
    const MATRIX_CACHE_VERSION = 'matrix-v1';
    const MODEL_CACHE_VERSION = 'model-v2'; // v2: full formula-linked assumptions schema
    const DECK_CACHE_VERSION = 'deck-v1';
    // The Business Plan moved to the investor-plan format (cover sheet + 13 sections), so
    // plans cached in the old generic format are regenerated.
    const reportVersionFor = (key) => (key === 'bizplan' ? 'report-v2-bizplan' : REPORT_CACHE_VERSION);

    // Milestones whose content is built on the 5-year financial model.
    const MODEL_DEPENDENT = new Set(['financial', 'bizplan', 'pitch', 'execbrief']);

    function signaturesFor(sow, intake, key) {
      const base = computeReportSignature(sow, intake);
      return {
        report: `${base}|${reportVersionFor(key)}`,
        matrix: `${base}|${MATRIX_CACHE_VERSION}`,
        model: `${base}|${MODEL_CACHE_VERSION}`,
        deck: `${base}|${DECK_CACHE_VERSION}`,
      };
    }

    function validModel(profile) {
      const entry = profile?.milestoneReports?.financial;
      if (!entry?.financialModel) return null;
      return entry.modelSignature === signaturesFor(profile.sow, profile.intake, 'financial').model ? entry.financialModel : null;
    }

    function executiveSummaryOf(report) {
      const sections = report?.sections || [];
      return (sections.find(s => s.heading === 'Executive Summary') || sections[0])?.content || '';
    }

    // Earlier milestones, in engagement order, reduced to their executive summaries — the
    // context every later milestone is written on top of.
    function priorContextFor(profile, key) {
      const idx = MILESTONE_CATALOG.findIndex(m => m.key === key);
      return MILESTONE_CATALOG.slice(0, idx)
        .map(m => ({ name: m.name, report: profile.milestoneReports?.[m.key]?.report }))
        .filter(x => x.report)
        .map(x => ({ name: x.name, summary: executiveSummaryOf(x.report) }));
    }

    // The most recent time any input this milestone builds on changed.
    function upstreamStampFor(profile, key) {
      const idx = MILESTONE_CATALOG.findIndex(m => m.key === key);
      const stamps = [profile.research?.generatedAt || ''];
      MILESTONE_CATALOG.slice(0, idx).forEach(m => {
        const at = profile.milestoneReports?.[m.key]?.reportGeneratedAt;
        if (at) stamps.push(at);
      });
      if (MODEL_DEPENDENT.has(key) && key !== 'financial') {
        const at = profile.milestoneReports?.financial?.modelGeneratedAt;
        if (at) stamps.push(at);
      }
      return stamps.sort().pop() || '';
    }

    function fmtUSDPrecise(v) {
      return `$${(Number(v) || 0).toFixed(2)}`;
    }

    function totalUsageUSD(profile) {
      return (profile?.usageLog || []).reduce((acc, e) => acc + (Number(e.usd) || 0), 0);
    }

    function useElapsedSeconds(active) {
      const [start, setStart] = useState(null);
      const [, tick] = useState(0);
      useEffect(() => {
        if (!active) { setStart(null); return; }
        setStart(Date.now());
        const id = setInterval(() => tick(t => t + 1), 1000);
        return () => clearInterval(id);
      }, [active]);
      return start ? Math.floor((Date.now() - start) / 1000) : 0;
    }

    function formatElapsed(sec) {
      return sec >= 60 ? `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s` : `${sec}s`;
    }

    function SourcesPanel({ sources, title = 'Sources cited in this report' }) {
      if (!sources?.length) return null;
      return (
        <details className="sources-panel">
          <summary>{title} ({sources.length})</summary>
          <ol>
            {sources.map(src => (
              <li key={src.id} value={Number(src.id.slice(1))}>
                [{src.id}] {safeHref(src.url) ? <a href={src.url} target="_blank" rel="noopener noreferrer">{src.title}</a> : src.title}
              </li>
            ))}
          </ol>
        </details>
      );
    }

    // ============ RESEARCH STEP ============
    function ResearchStep({ profile, onResearch, onSkip, onUsage, onContinue }) {
      const [state, setState] = useState(profile.research ? 'done' : 'idle');
      const [error, setError] = useState(null);
      const elapsed = useElapsedSeconds(state === 'loading');
      const research = profile.research;

      const run = async () => {
        setState('loading');
        setError(null);
        const res = await fetchResearch({ sow: profile.sow, intake: profile.intake, businessName: profile.name });
        const usage = res.data?.usage || res.usage;
        if (usage) onUsage('research', null, usage);
        if (res.error) {
          setError(res.error);
          setState('error');
          return;
        }
        onResearch(res.data.research);
        setState('done');
      };

      useEffect(() => {
        if (!profile.research) run();
      }, []);

      const sourceMap = sourceMapOf(research);

      return (
        <div className="view">
          <h2>Market Research</h2>
          <p style={{ color: '#555', marginBottom: '12px' }}>
            Before any analysis, MarketEdge searches the web for market sizing, competitors and industry benchmarks. Every report then cites these sources as [S1], [S2]… and marks anything it couldn't source as an estimate.
          </p>

          {state === 'loading' && (
            <div className="card">
              <div className="progress-line"><div className="spinner"></div> Searching the web and checking sources… <span className="muted">{formatElapsed(elapsed)} · usually 1–3 minutes</span></div>
            </div>
          )}

          {state === 'error' && (
            <div className="card">
              <div className="error">Research failed: {error}</div>
              <button onClick={run}>🔄 Try Again</button>
              <button className="secondary" onClick={onSkip}>Continue Without Research</button>
              <p style={{ fontSize: '13px', color: '#666', marginTop: '8px' }}>Without research, every market figure in your reports will be marked as an AI estimate. You can run research later from any milestone.</p>
            </div>
          )}

          {state === 'done' && research && (
            <>
              <div className="research-stats">
                <div className="research-stat"><div className="value">{research.sources.length}</div><div className="label">Verified sources</div></div>
                <div className="research-stat"><div className="value">{research.facts.length}</div><div className="label">Sourced facts</div></div>
                <div className="research-stat"><div className="value">{research.competitors.length}</div><div className="label">Verified competitors</div></div>
                <div className="research-stat"><div className="value">{research.searchCount || 0}</div><div className="label">Web searches run</div></div>
              </div>

              {research.marketSummary && <div className="report-highlight"><h4>What the research shows</h4><p>{research.marketSummary}</p></div>}

              {research.facts.length > 0 && (
                <div className="card">
                  <h3 style={{ marginBottom: '8px' }}>Sourced facts</h3>
                  <ul className="fact-list">
                    {research.facts.map((f, i) => <li key={i}>{renderFormattedText(`${f.claim} [${f.sourceId}]`, sourceMap)}</li>)}
                  </ul>
                </div>
              )}

              {research.competitors.length > 0 && (
                <div className="card">
                  <h3 style={{ marginBottom: '8px' }}>Verified competitors</h3>
                  <ul className="fact-list">
                    {research.competitors.map((c, i) => <li key={i}><strong>{c.name}</strong>{c.website ? ` (${c.website})` : ''} — {renderFormattedText(`${c.description} Pricing: ${c.pricing}. [${c.sourceId}]`, sourceMap)}</li>)}
                  </ul>
                </div>
              )}

              {research.gaps?.length > 0 && (
                <div className="notice"><strong>Couldn't verify:</strong> {research.gaps.join(' · ')}. Reports will mark related figures as estimates.</div>
              )}

              {research.droppedUnverified > 0 && (
                <p style={{ fontSize: '13px', color: '#666' }}>{research.droppedUnverified} item(s) were dropped because their source couldn't be matched to an actual search result.</p>
              )}

              <SourcesPanel sources={research.sources} title="All sources" />

              <div style={{ marginTop: '24px' }}>
                <button onClick={onContinue}>Continue to Milestones →</button>
                <button className="secondary" onClick={run}>🔄 Re-run Research</button>
              </div>
            </>
          )}
        </div>
      );
    }

    // Generations keep running when the user navigates to another milestone; this stops a
    // remount from starting a duplicate request for work already in progress.
    const IN_FLIGHT = new Map();

    const PROGRESS_TEXT = {
      model: 'Building the 5-year financial model…',
      report: 'Writing the report… (usually 2–4 minutes)',
      matrix: 'Building the competitor comparison…',
      deck: 'Drafting the pitch deck…',
    };

    function MilestoneStep({ milestone, profile, onCacheUpdate, onUsage, onRunResearch, onNext, onPrev, isFirst, isLast }) {
      const { sow, intake } = profile;
      const key = milestone.key;
      const sig = signaturesFor(sow, intake, key);
      const entry = profile.milestoneReports?.[key] || {};
      const isCompetitor = key === 'competitor';
      const isFinancial = key === 'financial';
      const isPitch = key === 'pitch';
      const needsModel = MODEL_DEPENDENT.has(key);

      const report = entry.reportSignature === sig.report ? entry.report : null;
      const matrix = entry.matrixSignature === sig.matrix ? entry.matrix : null;
      const deck = entry.deckSignature === sig.deck ? entry.deck : null;
      const model = needsModel ? validModel(profile) : null;
      const financialSummary = useMemo(() => (model ? computeFinancialSummary(model) : null), [model]);

      const [status, setStatus] = useState({});
      const [errors, setErrors] = useState({});
      const [regenNotes, setRegenNotes] = useState('');
      const [showRegenBox, setShowRegenBox] = useState(false);
      const [deckBuilding, setDeckBuilding] = useState(false);
      const profileRef = useRef(profile);
      profileRef.current = profile;

      const busy = Object.values(status).some(v => v === 'loading');
      const elapsed = useElapsedSeconds(busy);
      const flightKey = `${profile.id}:${key}`;

      const setPart = (part, value, err) => {
        setStatus(prev => ({ ...prev, [part]: value }));
        setErrors(prev => ({ ...prev, [part]: err || null }));
      };

      const missingSomething = () => !report || (isCompetitor && !matrix) || (isPitch && !deck) || (needsModel && !model);

      async function runGeneration({ force = false, notes } = {}) {
        const p = profileRef.current;
        const now = () => new Date().toISOString();
        const base = { sow, intake, businessName: p.name, research: p.research || null, notes };
        const priorContext = priorContextFor(p, key);

        let contextStamp = upstreamStampFor(p, key);
        let currentModel = needsModel ? validModel(p) : null;
        if (needsModel && (!currentModel || (force && isFinancial))) {
          setPart('model', 'loading');
          const res = await fetchFinancialModel({ ...base, notes: isFinancial ? notes : undefined, priorContext });
          const usage = res.data?.usage || res.usage;
          if (usage) onUsage('model', 'financial', usage);
          if (res.error) {
            setPart('model', 'error', res.error);
          } else {
            currentModel = res.data.model;
            const modelGeneratedAt = now();
            onCacheUpdate('financial', { financialModel: currentModel, modelSignature: sig.model, modelGeneratedAt, modelCost: usage });
            if (modelGeneratedAt > contextStamp) contextStamp = modelGeneratedAt;
            setPart('model', 'done');
          }
        }
        const fs = currentModel ? computeFinancialSummary(currentModel) : null;
        if (needsModel && !fs) {
          setPart('report', 'error', 'This milestone is built on the financial model, which could not be generated. Try again.');
          return;
        }

        const ctx = { ...base, priorContext, financialSummary: fs };
        const jobs = [];
        if (force || !report) {
          jobs.push((async () => {
            setPart('report', 'loading');
            const res = await fetchMilestoneReport({ ...ctx, milestoneKey: key, milestoneName: milestone.name });
            const usage = res.data?.usage || res.usage;
            if (usage) onUsage('report', key, usage);
            if (res.error) return setPart('report', 'error', res.error);
            onCacheUpdate(key, { report: res.data.report, reportSignature: sig.report, reportGeneratedAt: now(), reportContextStamp: contextStamp, reportCost: usage });
            setPart('report', 'done');
          })());
        }
        if (isCompetitor && (force || !matrix)) {
          jobs.push((async () => {
            setPart('matrix', 'loading');
            const res = await fetchCompetitorMatrix(ctx);
            const usage = res.data?.usage || res.usage;
            if (usage) onUsage('matrix', key, usage);
            if (res.error) return setPart('matrix', 'error', res.error);
            onCacheUpdate(key, { matrix: res.data.matrix, matrixSignature: sig.matrix, matrixGeneratedAt: now(), matrixCost: usage });
            setPart('matrix', 'done');
          })());
        }
        if (isPitch && (force || !deck)) {
          jobs.push((async () => {
            setPart('deck', 'loading');
            const res = await fetchPitchDeck(ctx);
            const usage = res.data?.usage || res.usage;
            if (usage) onUsage('deck', key, usage);
            if (res.error) return setPart('deck', 'error', res.error);
            onCacheUpdate(key, { deck: res.data.deck, deckSignature: sig.deck, deckGeneratedAt: now(), deckCost: usage });
            setPart('deck', 'done');
          })());
        }
        await Promise.all(jobs);
      }

      async function generate(opts) {
        if (IN_FLIGHT.has(flightKey)) return;
        const promise = runGeneration(opts);
        IN_FLIGHT.set(flightKey, promise);
        try { await promise; } finally { IN_FLIGHT.delete(flightKey); }
      }

      useEffect(() => {
        const running = IN_FLIGHT.get(flightKey);
        if (running) {
          setStatus({ report: 'loading' });
          running.finally(() => setStatus({}));
          return;
        }
        if (missingSomething()) generate();
      }, [flightKey]);

      const regenerate = () => {
        const notes = regenNotes.trim() || undefined;
        setShowRegenBox(false);
        setRegenNotes('');
        generate({ force: true, notes });
      };

      const displayReport = useMemo(() => (report ? injectModelTables(report, financialSummary) : null), [report, financialSummary]);
      const docOpts = { research: profile.research, businessName: profile.name };

      const downloadPDF = () => displayReport && generateReportPDF(displayReport, milestone, intake, docOpts);
      const printReport = () => {
        if (!displayReport) return;
        const printWindow = window.open('', '', 'width=900,height=1100');
        printWindow.document.write(buildReportHTML(displayReport, milestone, intake, docOpts));
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => printWindow.print(), 300);
      };
      const downloadDeck = async () => {
        if (!deck) return;
        setDeckBuilding(true);
        try {
          await generatePitchDeckPptx(deck, financialSummary, profile.research, profile.name);
        } catch (e) {
          reportClientError('pptx', e);
          alert(`The deck couldn't be built: ${e.message}`);
        } finally {
          setDeckBuilding(false);
        }
      };

      const numberedReport = displayReport ? parseAndNumberReport(displayReport) : null;
      const summarySection = numberedReport?.sections?.find(s => s.heading === 'Executive Summary') || numberedReport?.sections?.[0];
      const restSections = (numberedReport?.sections || []).filter(s => s !== summarySection);
      const sourceMap = sourceMapOf(profile.research);
      const sources = displayReport ? citedSources(displayReport, profile.research) : [];

      const upstreamChanged = report && entry.reportContextStamp && upstreamStampFor(profile, key) > entry.reportContextStamp;
      const milestoneCost = [entry.reportCost, entry.matrixCost, entry.deckCost, isFinancial ? entry.modelCost : null]
        .filter(Boolean).reduce((acc, u) => acc + (Number(u.usd) || 0), 0);

      return (
        <div className="view">
          <div className="report-banner">📊 {milestone.name}</div>

          {!profile.research && (
            <div className="notice">
              This engagement has no live web research, so market sizes, competitor details and benchmarks in this report are AI estimates.
              <div><button className="secondary" onClick={onRunResearch} disabled={busy}>🔎 Run Market Research</button></div>
            </div>
          )}

          {upstreamChanged && !busy && (
            <div className="notice">
              Earlier milestones, the financial model or the market research changed after this report was written, so it may no longer line up with them.
              <div><button className="secondary" onClick={() => generate({ force: true })}>🔄 Regenerate to bring it in line</button></div>
            </div>
          )}

          {busy && Object.entries(status).filter(([, v]) => v === 'loading').map(([part]) => (
            <div key={part} className="progress-line"><div className="spinner"></div> {PROGRESS_TEXT[part]} <span className="muted">{formatElapsed(elapsed)}</span></div>
          ))}
          {busy && report && <p className="muted" style={{ fontSize: '13px', color: '#778' }}>Your current version stays below until the new one is ready. You can move to other milestones meanwhile.</p>}

          {Object.entries(errors).filter(([, e]) => e).map(([part, e]) => (
            <div key={part} className="error">
              {part === 'report' ? 'Report' : part === 'matrix' ? 'Competitor comparison' : part === 'deck' ? 'Pitch deck' : 'Financial model'} error: {e}
              <button className="secondary" style={{ marginLeft: '12px' }} onClick={() => generate()} disabled={busy}>🔄 Try Again</button>
            </div>
          ))}

          {displayReport && (
            <>
              <div className="report-section">
                <h3>{displayReport.title}</h3>
                <div className="ai-disclaimer">{AI_DISCLAIMER}</div>

                {displayReport.cover?.length > 0 && (
                  <div className="report-table-wrap">
                    <table className="report-table">
                      <tbody>{displayReport.cover.map((r, i) => <tr key={i}><td style={{ fontWeight: 700, width: '35%' }}>{r.label}</td><td>{r.value}</td></tr>)}</tbody>
                    </table>
                  </div>
                )}

                {summarySection && (
                  <div className="report-highlight">
                    <h4>{summarySection.sectionNumber}. {summarySection.heading}</h4>
                    {renderBlocksJSX(summarySection.blocks, sourceMap)}
                  </div>
                )}

                {restSections.length > 0 && (
                  <div className="snapshot-outline">
                    <h4>Also in the full report</h4>
                    <ul>
                      {restSections.map((section) => (
                        <li key={section.sectionNumber}>{section.sectionNumber}. {section.heading}</li>
                      ))}
                    </ul>
                  </div>
                )}

                <SourcesPanel sources={sources} />
              </div>

              <div style={{ textAlign: 'center', margin: '20px 0 4px' }}>
                <button onClick={downloadPDF}>⬇️ Download Full Report</button>
                <button onClick={printReport} className="secondary">🖨️ Print</button>
                {isCompetitor && matrix && (
                  <button onClick={() => generateCompetitorExcel(matrix, milestone, intake, profile.research)}>📊 Download Competitor Comparison (Excel)</button>
                )}
                {isFinancial && model && (
                  <button onClick={() => generateFinancialModelExcel(model, milestone, intake, profile.research)}>📈 Download Financial Model (Excel)</button>
                )}
                {isPitch && deck && (
                  <button onClick={downloadDeck} disabled={deckBuilding}>{deckBuilding ? '⏳ Building deck…' : '🖥️ Download Pitch Deck (PowerPoint)'}</button>
                )}
              </div>
              {milestoneCost > 0 && <p className="cost-line">AI cost of the current version of this milestone: {fmtUSDPrecise(milestoneCost)}</p>}

              <div style={{ margin: '8px 0 20px', textAlign: 'center' }}>
                {!showRegenBox && (
                  <button className="secondary" onClick={() => setShowRegenBox(true)} disabled={busy}>
                    🔄 Regenerate This Milestone
                  </button>
                )}
                {showRegenBox && (
                  <div className="card" style={{ marginTop: '12px', textAlign: 'left', maxWidth: '560px', marginLeft: 'auto', marginRight: 'auto' }}>
                    <label style={{ display: 'block', marginBottom: '8px', fontSize: '11pt', color: '#555' }}>
                      Optional: describe what should change (leave blank to just run it again as-is). Your current version stays saved until this finishes.
                    </label>
                    <textarea
                      value={regenNotes}
                      onChange={(e) => setRegenNotes(e.target.value)}
                      placeholder="e.g. Focus more on the EU market, assume a higher price point, add a more conservative scenario…"
                      rows={3}
                      style={{ width: '100%', marginBottom: '10px', fontFamily: 'inherit' }}
                    />
                    <button onClick={regenerate} disabled={busy}>🔄 Regenerate</button>
                    <button className="secondary" onClick={() => { setShowRegenBox(false); setRegenNotes(''); }} disabled={busy}>Cancel</button>
                  </div>
                )}
              </div>
            </>
          )}

          <div style={{ marginTop: '30px', display: 'flex', gap: '12px' }}>
            <button onClick={onPrev} disabled={isFirst}>← Previous</button>
            <button className="secondary" onClick={onNext}>
              {isLast ? '✅ Complete' : 'Next →'}
            </button>
          </div>
        </div>
      );
    }

    function CompleteStep({ profile, bookingUrl, onOpenMilestone }) {
      const generated = MILESTONE_CATALOG.filter(m => profile.milestoneReports?.[m.key]?.report);
      const financialSummary = useMemo(() => computeFinancialSummary(validModel(profile)), [profile]);
      const [building, setBuilding] = useState(false);

      const downloadBook = async () => {
        setBuilding(true);
        try {
          await generateStrategyBookPDF(profile, MILESTONE_CATALOG, financialSummary);
        } catch (e) {
          reportClientError('strategy-book', e);
          alert(`The Strategy Book couldn't be built: ${e.message}`);
        } finally {
          setBuilding(false);
        }
      };

      const log = profile.usageLog || [];
      const sumWhere = (pred) => log.filter(pred).reduce((acc, e) => acc + (Number(e.usd) || 0), 0);
      const costRows = [
        { label: 'Scope of work', usd: sumWhere(e => e.kind === 'sow' || e.kind === 'sow-chat') },
        { label: 'Market research', usd: sumWhere(e => e.kind === 'research') },
        ...MILESTONE_CATALOG.map(m => ({ label: m.name, usd: sumWhere(e => e.key === m.key) })),
      ].filter(r => r.usd > 0);
      const total = totalUsageUSD(profile);

      return (
        <div className="view">
          <h1>{generated.length === MILESTONE_CATALOG.length ? '🎉 Engagement Complete' : 'Strategy Book'}</h1>

          <div className="card">
            <h3 style={{ marginBottom: '8px' }}>Your Strategy Book</h3>
            <p style={{ color: '#555', marginBottom: '12px' }}>One PDF combining every generated milestone, with a contents page and a single list of sources.</p>
            <table className="complete-table">
              <tbody>
                {MILESTONE_CATALOG.map((m, i) => {
                  const done = !!profile.milestoneReports?.[m.key]?.report;
                  return (
                    <tr key={m.key}>
                      <td>{done ? '✅' : '⬜'} {m.name}</td>
                      <td className="num"><button className="secondary" style={{ margin: 0, padding: '6px 12px', fontSize: '12px' }} onClick={() => onOpenMilestone(i)}>{done ? 'Open' : 'Generate'}</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <button onClick={downloadBook} disabled={building || generated.length === 0}>
              {building ? '⏳ Building Strategy Book…' : `📘 Download Strategy Book (${generated.length} milestone${generated.length === 1 ? '' : 's'})`}
            </button>
          </div>

          {bookingUrl && (
            <div className="card">
              <h3 style={{ marginBottom: '8px' }}>Talk it through</h3>
              <p style={{ color: '#555' }}>Book a follow-up call to walk through the strategy and next steps.</p>
              <button style={{ marginTop: '12px' }} onClick={() => window.open(bookingUrl, '_blank', 'noopener')}>📅 Book Follow-up Call</button>
            </div>
          )}

          {total > 0 && (
            <div className="card">
              <h3 style={{ marginBottom: '8px' }}>AI cost of this engagement</h3>
              <p style={{ color: '#555', fontSize: '14px' }}>Actual Anthropic API usage, including regenerations, at Claude Sonnet 5 rates ($2 / $10 per million input / output tokens) plus $0.01 per web search.</p>
              <table className="complete-table">
                <thead><tr><th>Step</th><th className="num">Cost</th></tr></thead>
                <tbody>
                  {costRows.map(r => <tr key={r.label}><td>{r.label}</td><td className="num">{fmtUSDPrecise(r.usd)}</td></tr>)}
                  <tr><td><strong>Total</strong></td><td className="num"><strong>{fmtUSDPrecise(total)}</strong></td></tr>
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function AppFooter() {
      return (
        <footer className="app-footer">
          © {new Date().getFullYear()} MarketEdge · AI-generated analysis — verify before relying on it
          <div style={{ marginTop: '6px' }}>
            <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>
            <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
          </div>
        </footer>
      );
    }

    // ============ MAIN APP ============
    function App() {
      const [view, setView] = useState('login');
      const [profile, setProfile] = useState(null);
      const [config, setConfig] = useState({});

      useEffect(() => {
        loadAppConfig().then(setConfig);
        const currentBusinessId = storage.getCurrentBusinessId();
        if (currentBusinessId) {
          const profiles = storage.getProfiles();
          const business = profiles.businesses.find(b => b.id === currentBusinessId);
          if (business) {
            setProfile(business);
            setView('engagement');
          }
        }
      }, []);

      const hasAnyReport = MILESTONE_CATALOG.some(m => profile?.milestoneReports?.[m.key]?.report);
      const allSteps = [
        { key: 'intake', label: 'Intake', completed: !!profile?.intake },
        { key: 'sow_review', label: 'SOW Review', completed: !!profile?.sow },
        { key: 'research', label: 'Market Research', completed: !!profile?.research },
        ...MILESTONE_CATALOG.map((m, i) => ({
          key: `milestone-${i}`,
          label: m.name,
          completed: !!profile?.milestoneReports?.[m.key]?.report,
        })),
        { key: 'complete', label: 'Strategy Book', completed: profile?.stage === 'complete' }
      ];

      const persistProfile = (prev, updates) => {
        const newProfile = { ...prev, ...updates };
        const profiles = storage.getProfiles();
        const idx = profiles.businesses.findIndex(b => b.id === newProfile.id);
        if (idx >= 0) {
          profiles.businesses[idx] = newProfile;
          storage.saveProfiles(profiles);
        }
        return newProfile;
      };

      const handleUpdateProfile = (updates) => {
        setProfile(prev => persistProfile(prev, updates));
      };

      const handleCacheUpdate = (milestoneKey, patch) => {
        setProfile(prev => persistProfile(prev, {
          milestoneReports: {
            ...prev.milestoneReports,
            [milestoneKey]: { ...(prev.milestoneReports?.[milestoneKey] || {}), ...patch }
          }
        }));
      };

      const recordUsage = (kind, key, usage) => {
        if (!usage) return;
        const row = {
          at: new Date().toISOString(), kind, key,
          usd: Number(usage.usd) || 0,
          inputTokens: usage.inputTokens || 0, outputTokens: usage.outputTokens || 0,
          cacheReadTokens: usage.cacheReadTokens || 0, webSearches: usage.webSearches || 0,
        };
        setProfile(prev => persistProfile(prev, { usageLog: [...(prev.usageLog || []), row] }));
      };

      const handleStepClick = (stepKey) => {
        const pastScope = profile && ['research', 'milestones', 'complete'].includes(profile.stage);
        if (!pastScope) return;
        if (stepKey === 'research') {
          handleUpdateProfile({ stage: 'research' });
        } else if (stepKey.startsWith('milestone-')) {
          const idx = parseInt(stepKey.split('-')[1]);
          handleUpdateProfile({ stage: 'milestones', currentMilestoneIndex: idx });
        } else if (stepKey === 'complete' && hasAnyReport) {
          handleUpdateProfile({ stage: 'complete' });
        }
      };

      const handleLogin = () => {
        setView('business-selector');
      };

      const handleSelectBusiness = (businessId) => {
        const profiles = storage.getProfiles();
        const business = profiles.businesses.find(b => b.id === businessId);
        if (business) {
          setProfile(business);
          storage.setCurrentBusinessId(businessId);
          setView('engagement');
        }
      };

      const handleCreateBusiness = (name) => {
        const profiles = storage.getProfiles();
        const newBusiness = {
          id: Date.now().toString(),
          name,
          createdAt: new Date().toISOString(),
          stage: 'intake',
          intake: null,
          sow: null,
          research: null,
          milestones: [],
          milestoneReports: {},
          usageLog: [],
          sowFeedback: [],
          currentMilestoneIndex: 0
        };
        profiles.businesses.push(newBusiness);
        storage.saveProfiles(profiles);
        setProfile(newBusiness);
        storage.setCurrentBusinessId(newBusiness.id);
        setView('engagement');
      };

      const handleSwitchBusiness = () => {
        setView('business-selector');
      };

      if (view === 'login') {
        return <><LoginView onLogin={handleLogin} /><AppFooter /></>;
      }

      if (view === 'business-selector') {
        return <><BusinessSelectorView onSelectBusiness={handleSelectBusiness} onCreateBusiness={handleCreateBusiness} /><AppFooter /></>;
      }

      if (view === 'engagement' && profile) {
        const currentIndex = profile.currentMilestoneIndex || 0;
        const currentMilestone = MILESTONE_CATALOG[currentIndex];
        const currentStep = profile.stage === 'intake' ? 'intake'
          : profile.stage === 'sow_review' ? 'sow_review'
          : profile.stage === 'research' ? 'research'
          : profile.stage === 'complete' ? 'complete'
          : `milestone-${currentIndex}`;

        return (
          <div className="app-container">
            <ProgressSidebar
              currentStep={currentStep}
              onStepClick={handleStepClick}
              allSteps={allSteps}
              currentBusinessName={profile.name}
              onSwitchBusiness={handleSwitchBusiness}
              totalCost={totalUsageUSD(profile)}
            />
            <div className="main-content">
              {profile.stage === 'intake' && (
                <IntakeStep
                  initialIntake={profile.intake}
                  initialConsent={profile.consentAt}
                  onComplete={(intake, sow, usage) => {
                    handleUpdateProfile({ intake, sow, stage: 'sow_review', consentAt: profile.consentAt || new Date().toISOString() });
                    recordUsage('sow', null, usage);
                  }}
                />
              )}
              {profile.stage === 'sow_review' && profile.sow && (
                <SOWStep
                  sow={profile.sow}
                  intake={profile.intake}
                  onUsage={recordUsage}
                  onRevision={(newSOW) => {
                    handleUpdateProfile({ sow: newSOW });
                  }}
                  onApprove={() => {
                    handleUpdateProfile({ stage: 'research', currentMilestoneIndex: 0 });
                  }}
                />
              )}
              {profile.stage === 'research' && (
                <ResearchStep
                  profile={profile}
                  onUsage={recordUsage}
                  onResearch={(research) => handleUpdateProfile({ research })}
                  onSkip={() => handleUpdateProfile({ stage: 'milestones' })}
                  onContinue={() => handleUpdateProfile({ stage: 'milestones' })}
                />
              )}
              {profile.stage === 'milestones' && currentMilestone && (
                <MilestoneStep
                  key={currentMilestone.key}
                  milestone={currentMilestone}
                  profile={profile}
                  onCacheUpdate={handleCacheUpdate}
                  onUsage={recordUsage}
                  onRunResearch={() => handleUpdateProfile({ stage: 'research' })}
                  onNext={() => {
                    if (currentIndex >= MILESTONE_CATALOG.length - 1) {
                      handleUpdateProfile({ stage: 'complete' });
                    } else {
                      handleUpdateProfile({ currentMilestoneIndex: currentIndex + 1 });
                    }
                  }}
                  onPrev={() => {
                    if (currentIndex > 0) {
                      handleUpdateProfile({ currentMilestoneIndex: currentIndex - 1 });
                    }
                  }}
                  isFirst={currentIndex === 0}
                  isLast={currentIndex >= MILESTONE_CATALOG.length - 1}
                />
              )}
              {profile.stage === 'complete' && (
                <CompleteStep
                  profile={profile}
                  bookingUrl={config.bookingUrl}
                  onOpenMilestone={(idx) => handleUpdateProfile({ stage: 'milestones', currentMilestoneIndex: idx })}
                />
              )}
              <AppFooter />
            </div>
          </div>
        );
      }

      return <div className="view"><p>Loading...</p></div>;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
