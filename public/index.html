          }
          case 'competitors':
            deckTitle(slide, sl.title || 'Competitors', kick);
            renderDeckTable(slide, ['Competitor', 'Positioning', 'Pricing', 'Gap We Exploit'],
              (sl.competitors || []).map(c => [c.name, c.positioning, c.pricing, c.weakness]));
            deckTakeaway(slide, sl.advantage ? `Our edge: ${sl.advantage}` : '');
            break;
          case 'marketing':
            deckTitle(slide, sl.title || 'Marketing Strategy', kick);
            (sl.channels || []).forEach((c, i) => {
              const y = 1.0 + i * 0.7;
              slide.addShape('rect', { x: 0.5, y, w: 2.1, h: 0.62, fill: { color: DECK.navy }, line: { color: DECK.navy } });
              slide.addText(c.channel, { x: 0.6, y, w: 1.9, h: 0.62, fontFace: DECK.bodyFont, fontSize: 12, bold: true, color: DECK.white, valign: 'middle', fit: 'shrink' });
              slide.addShape('rect', { x: 2.65, y, w: 4.75, h: 0.62, fill: { color: DECK.card }, line: { color: DECK.card } });
              slide.addText(c.tactic, { x: 2.75, y, w: 4.6, h: 0.62, fontFace: DECK.bodyFont, fontSize: 10.5, color: DECK.body, valign: 'middle', fit: 'shrink' });
              slide.addShape('rect', { x: 7.45, y, w: 2.05, h: 0.62, fill: { color: 'FFF3E8' }, line: { color: 'FFF3E8' } });
              slide.addText(c.kpi ? `KPI: ${c.kpi}` : '', { x: 7.5, y, w: 1.95, h: 0.62, fontFace: DECK.bodyFont, fontSize: 10, bold: true, color: DECK.accent, valign: 'middle', fit: 'shrink' });
            });
            deckTakeaway(slide, sl.callout);
            break;
          case 'costAnalysis': {
            deckTitle(slide, sl.title || 'Cost Analysis', kick);
            if (!fs) { renderDeckChart(slide, sl, null); break; }
            slide.addChart('bar', [
              { name: 'People costs', labels: YEAR_LABELS, values: fs.salaries.map(toM) },
              { name: 'Other operating costs', labels: YEAR_LABELS, values: fs.opex.map(toM) },
            ], { x: 0.5, y: 1.0, w: 5.6, h: 3.5, ...chartBase, barDir: 'col', barGrouping: 'stacked', chartColors: [DECK.navy, DECK.accent], valAxisLabelFormatCode: '$0.0"M"', showLegend: true, legendPos: 'b' });
            const peopleShare = fs.totalCosts[0] ? fs.salaries[0] / fs.totalCosts[0] : 0;
            deckStatColumn(slide, [
              { value: fmtMoney(fs.totalCosts[0]), label: `Year 1 operating costs → ${fmtMoney(fs.totalCosts[4])} by Year 5` },
              { value: `${Math.round(peopleShare * 100)}%`, label: 'of Year 1 costs are people' },
            ], 6.3, 3.2);
            const top = [...(fs.costCategories || [])].sort((a, b) => b.values[0] - a.values[0]).slice(0, 3);
            if (top.length) {
              slide.addTable([
                [{ text: 'Largest other costs', options: { bold: true, color: DECK.white, fill: { color: DECK.navy } } }, { text: 'Year 1', options: { bold: true, color: DECK.white, fill: { color: DECK.navy } } }],
                ...top.map(c => [{ text: c.name }, { text: fmtMoney(c.values[0]) }]),
              ], { x: 6.3, y: 3.35, w: 3.2, colW: [2.2, 1.0], fontFace: DECK.bodyFont, fontSize: 9, color: DECK.body, border: { type: 'solid', pt: 0.5, color: 'E2E2E2' }, margin: 0.04, autoPage: false });
            }
            deckTakeaway(slide, sl.takeaway);
            break;
          }
          case 'roadmap': {
            deckTitle(slide, sl.title || 'Milestones', kick);
            const items = sl.items || [];
            const step = 8.6 / Math.max(1, items.length);
            slide.addShape('line', { x: 0.7, y: 2.2, w: 8.6, h: 0, line: { color: DECK.accent, width: 3 } });
            items.forEach((it, i) => {
              const cx = 0.7 + step * i + step / 2;
              slide.addShape('ellipse', { x: cx - 0.13, y: 2.07, w: 0.26, h: 0.26, fill: { color: i === 0 ? DECK.accent : DECK.navy }, line: { color: DECK.white, width: 2 } });
              slide.addText(it.when, { x: cx - step / 2, y: 1.45, w: step, h: 0.45, fontFace: DECK.bodyFont, fontSize: 12, bold: true, color: DECK.accent, align: 'center', fit: 'shrink' });
              slide.addShape('rect', { x: cx - step / 2 + 0.06, y: 2.55, w: step - 0.12, h: 1.9, fill: { color: DECK.card }, line: { color: DECK.card } });
              slide.addText(it.milestone, { x: cx - step / 2 + 0.12, y: 2.6, w: step - 0.24, h: 1.8, fontFace: DECK.bodyFont, fontSize: 10.5, color: DECK.body, valign: 'top', fit: 'shrink' });
            });
            break;
          }
          case 'sources':
            deckTitle(slide, 'Sources', kick);
            slide.addText(cited.slice(0, 14).map(s => ({ text: `[${s.id}] ${s.title} — ${s.url}`, options: { breakLine: true, hyperlink: safeHref(s.url) ? { url: s.url } : undefined } })), {
              x: 0.5, y: 1.0, w: 9.0, h: 4.0, fontSize: 9, color: DECK.body, fontFace: DECK.bodyFont, paraSpaceAfter: 3, valign: 'top', fit: 'shrink',
            });
            break;
          default:
            deckTitle(slide, sl.title, kick);
        }
        deckFooter(slide, footer, n, total);
      });

      await pptx.writeFile({ fileName: `${fileSafe(company)}-Pitch-Deck.pptx` });
    }

    function computeReportSignature(sow, intake) {
      return JSON.stringify({ sow, intake });
    }
    const REPORT_CACHE_VERSION = 'report-v1';
    const MATRIX_CACHE_VERSION = 'matrix-v1';
    const MODEL_CACHE_VERSION = 'model-v2'; // v2: full formula-linked assumptions schema
    const DECK_CACHE_VERSION = 'deck-v1';
    // The Business Plan moved to the investor-plan format (cover sheet + 13 sections), so
    // plans cached in the old generic format are regenerated.
    const reportVersionFor = (key) => (key === 'bizplan' ? 'report-v2-bizplan' : REPORT_CACHE_VERSION);

    // Milestones whose content is built on the 5-year financial model.
    const MODEL_DEPENDENT = new Set(['financial', 'bizplan', 'pitch', 'execbrief']);

    function signaturesFor(sow, intake, key) {
      const base = computeReportSignature(sow, intake);
      return {
        report: `${base}|${reportVersionFor(key)}`,
        matrix: `${base}|${MATRIX_CACHE_VERSION}`,
        model: `${base}|${MODEL_CACHE_VERSION}`,
        deck: `${base}|${DECK_CACHE_VERSION}`,
      };
    }

    function validModel(profile) {
      const entry = profile?.milestoneReports?.financial;
      if (!entry?.financialModel) return null;
      return entry.modelSignature === signaturesFor(profile.sow, profile.intake, 'financial').model ? entry.financialModel : null;
    }

    function executiveSummaryOf(report) {
      const sections = report?.sections || [];
      return (sections.find(s => s.heading === 'Executive Summary') || sections[0])?.content || '';
    }

    // Earlier milestones, in engagement order, reduced to their executive summaries — the
    // context every later milestone is written on top of.
    function priorContextFor(profile, key) {
      const idx = MILESTONE_CATALOG.findIndex(m => m.key === key);
      return MILESTONE_CATALOG.slice(0, idx)
        .map(m => ({ name: m.name, report: profile.milestoneReports?.[m.key]?.report }))
        .filter(x => x.report)
        .map(x => ({ name: x.name, summary: executiveSummaryOf(x.report) }));
    }

    // The most recent time any input this milestone builds on changed.
    function upstreamStampFor(profile, key) {
      const idx = MILESTONE_CATALOG.findIndex(m => m.key === key);
      const stamps = [profile.research?.generatedAt || '', profile.intakeUpdatedAt || ''];
      MILESTONE_CATALOG.slice(0, idx).forEach(m => {
        const at = profile.milestoneReports?.[m.key]?.reportGeneratedAt;
        if (at) stamps.push(at);
      });
      if (MODEL_DEPENDENT.has(key) && key !== 'financial') {
        const at = profile.milestoneReports?.financial?.modelGeneratedAt;
        if (at) stamps.push(at);
      }
      return stamps.sort().pop() || '';
    }

    function useElapsedSeconds(active) {
      const [start, setStart] = useState(null);
      const [, tick] = useState(0);
      useEffect(() => {
        if (!active) { setStart(null); return; }
        setStart(Date.now());
        const id = setInterval(() => tick(t => t + 1), 1000);
        return () => clearInterval(id);
      }, [active]);
      return start ? Math.floor((Date.now() - start) / 1000) : 0;
    }

    function formatElapsed(sec) {
      return sec >= 60 ? `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, '0')}s` : `${sec}s`;
    }

    function SourcesPanel({ sources, title = 'Sources cited in this report' }) {
      if (!sources?.length) return null;
      return (
        <details className="sources-panel">
          <summary>{title} ({sources.length})</summary>
          <ol>
            {sources.map(src => (
              <li key={src.id} value={Number(src.id.slice(1))}>
                [{src.id}] {safeHref(src.url) ? <a href={src.url} target="_blank" rel="noopener noreferrer">{src.title}</a> : src.title}
              </li>
            ))}
          </ol>
        </details>
      );
    }

    // ============ REPORT OVERVIEW: SUMMARY, CONTENTS, ROADMAP ============
    // A markdown table with Phase / Timeline / Key Actions columns is a phased plan; it is
    // drawn as a visual timeline on screen, in print and in the PDF.
    function roadmapColumns(header) {
      const idx = (re) => header.findIndex(h => re.test(String(h).trim()));
      const cols = { phase: idx(/^phase/i), when: idx(/^(timeline|timing|when|timeframe)/i), actions: idx(/action/i), owner: idx(/^owner/i), measure: idx(/(success|measure|kpi|metric)/i) };
      return cols.phase !== -1 && cols.when !== -1 && cols.actions !== -1 ? cols : null;
    }

    function isRoadmapTable(block) {
      return block?.type === 'table' && !!roadmapColumns(block.header);
    }

    function roadmapPhases(block) {
      const cols = roadmapColumns(block.header);
      const cell = (row, i) => (i === -1 ? '' : stripInlineBold(row[i] || ''));
      return block.rows.map(r => ({
        phase: cell(r, cols.phase),
        when: cell(r, cols.when),
        actions: cell(r, cols.actions).split(/\s*;\s*|\s*•\s*|<br\s*\/?>/i).map(a => a.trim()).filter(Boolean),
        owner: cell(r, cols.owner),
        measure: cell(r, cols.measure),
      })).filter(p => p.phase || p.when);
    }

    function findRoadmapBlock(numbered) {
      const sections = numbered?.sections || [];
      const ordered = [...sections.filter(s => /roadmap/i.test(s.heading)), ...sections.filter(s => !/roadmap/i.test(s.heading))];
      for (const sec of ordered) {
        const b = sec.blocks.find(isRoadmapTable);
        if (b) return b;
      }
      return null;
    }

    function RoadmapVisual({ block }) {
      const phases = roadmapPhases(block);
      return (
        <div className="roadmap" role="list" aria-label="Action roadmap">
          {phases.map((p, i) => (
            <div className="roadmap-phase" role="listitem" key={i}>
              <div className="roadmap-dot">{i + 1}</div>
              <div className="roadmap-box">
                <div className="roadmap-when">{p.when}</div>
                <div className="roadmap-name">{p.phase}</div>
                <ul className="roadmap-actions">{p.actions.map((a, j) => <li key={j}>{a}</li>)}</ul>
                {(p.owner || p.measure) && (
                  <div className="roadmap-meta">
                    {p.owner && <div><b>Owner:</b> {p.owner}</div>}
                    {p.measure && <div><b>Success:</b> {p.measure}</div>}
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function ReportSummaryCard({ report, numbered, sourceMap }) {
      const sum = report?.summary;
      if (sum && (sum.bottomLine || sum.points?.length)) {
        return (
          <div className="summary-card">
            <h2 className="card-title"><span className="ic"><Icon name="summary" size={22} /></span>Report Summary</h2>
            {sum.bottomLine && <div className="bottom-line"><span className="lbl">BOTTOM LINE</span>{renderFormattedText(sum.bottomLine, sourceMap)}</div>}
            {sum.points?.length > 0 && (
              <ul className="takeaways">
                {sum.points.map((pt, i) => <li key={i}><span className="n">{i + 1}</span><span>{renderFormattedText(pt, sourceMap)}</span></li>)}
              </ul>
            )}
            {sum.nextStep && <div className="next-step"><span className="lbl">Next step →</span><span>{renderFormattedText(sum.nextStep, sourceMap)}</span></div>}
          </div>
        );
      }
      // Reports written before whole-report summaries existed fall back to their executive summary.
      const exec = numbered?.sections?.find(s => s.heading === 'Executive Summary') || numbered?.sections?.[0];
      if (!exec) return null;
      return (
        <div className="summary-card report-highlight" style={{ borderLeft: '4px solid #0F766E' }}>
          <h2 className="card-title"><span className="ic"><Icon name="summary" size={22} /></span>Executive Summary</h2>
          {renderBlocksJSX(exec.blocks, sourceMap)}
        </div>
      );
    }

    // The table of contents of THIS report: every numbered section and the sub-topics it covers.
    // A section's sub-topics: its "##" sub-headings, or its numbered "###" points if it has none.
    function sectionTopics(section) {
      const h3 = section.blocks.filter(b => b.type === 'h3').map(b => b.text);
      return h3.length ? h3 : section.blocks.filter(b => b.type === 'h4').map(b => b.text);
    }

    function reportContents(numbered) {
      return (numbered?.sections || []).map(s => ({
        number: s.sectionNumber,
        heading: s.heading,
        topics: sectionTopics(s),
      }));
    }

    function ReportContents({ numbered }) {
      const rows = reportContents(numbered);
      if (!rows.length) return null;
      return (
        <div className="contents-card">
          <h2 className="card-title"><span className="ic"><Icon name="list" size={22} /></span>Contents of the full report</h2>
          <table className="contents-table">
            <thead><tr><th>#</th><th>Section</th><th>What it covers</th></tr></thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.number}>
                  <td className="num">{String(r.number).padStart(2, '0')}</td>
                  <td className="sec">{r.heading}</td>
                  <td>{r.topics.length ? <div className="subs">{r.topics.map((t, i) => <span key={i}>{t}</span>)}</div> : <span style={{ color: '#8A97A5' }}>Narrative analysis</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ============ RESEARCH STEP ============
    function ResearchStep({ profile, onResearch, onSkip, onUsage, onContinue }) {
      const [state, setState] = useState(profile.research ? 'done' : 'idle');
      const [error, setError] = useState(null);
      const elapsed = useElapsedSeconds(state === 'loading');
      const research = profile.research;

      const run = async () => {
        setState('loading');
        setError(null);
        const res = await fetchResearch({ sow: profile.sow, intake: profile.intake, businessName: profile.name });
        const usage = res.data?.usage || res.usage;
        if (usage) onUsage('research', null, usage);
        if (res.error) {
          setError(res.error);
          setState('error');
          return;
        }
        onResearch(res.data.research);
        setState('done');
      };

      useEffect(() => {
        if (!profile.research) run();
      }, []);

      const sourceMap = sourceMapOf(research);

      return (
        <div className="view">
          <PageHeader icon="research" kicker="Step 3" title="Market Research" tone="teal"
            status={state === 'done' && research ? { text: `${research.sources.length} verified sources` } : null} />
          {state === 'done' && research && profile.intakeUpdatedAt && profile.intakeUpdatedAt > (research.generatedAt || '') && (
            <div className="notice">
              Your intake changed after this research ran. Re-run it so every report draws on facts for your updated business.
              <div><button className="secondary" onClick={run}>🔄 Re-run Research</button></div>
            </div>
          )}
          <p style={{ color: '#555', marginBottom: '12px' }}>
            Before any analysis, MarketEdge searches the web for market sizing, competitors and industry benchmarks. Every report then cites these sources as [S1], [S2]… and marks anything it couldn't source as an estimate.
          </p>

          {state === 'loading' && (
            <div className="card">
              <div className="progress-line"><div className="spinner"></div> Searching the web and checking sources… <span className="muted">{formatElapsed(elapsed)} · usually 1–3 minutes</span></div>
            </div>
          )}

          {state === 'error' && (
            <div className="card">
              <div className="error">Research failed: {error}</div>
              <button onClick={run}>🔄 Try Again</button>
              <button className="secondary" onClick={onSkip}>Continue Without Research</button>
              <p style={{ fontSize: '13px', color: '#666', marginTop: '8px' }}>Without research, every market figure in your reports will be marked as an AI estimate. You can run research later from any milestone.</p>
            </div>
          )}

          {state === 'done' && research && (
            <>
              <div className="research-stats">
                <div className="research-stat"><div className="value">{research.sources.length}</div><div className="label">Verified sources</div></div>
                <div className="research-stat"><div className="value">{research.facts.length}</div><div className="label">Sourced facts</div></div>
                <div className="research-stat"><div className="value">{research.competitors.length}</div><div className="label">Verified competitors</div></div>
                <div className="research-stat"><div className="value">{research.searchCount || 0}</div><div className="label">Web searches run</div></div>
              </div>

              {research.marketSummary && <div className="report-highlight"><h4>What the research shows</h4><p>{research.marketSummary}</p></div>}

              {research.facts.length > 0 && (
                <div className="card">
                  <h3 style={{ marginBottom: '8px' }}>Sourced facts</h3>
                  <ul className="fact-list">
                    {research.facts.map((f, i) => <li key={i}>{renderFormattedText(`${f.claim} [${f.sourceId}]`, sourceMap)}</li>)}
                  </ul>
                </div>
              )}

              {research.competitors.length > 0 && (
                <div className="card">
                  <h3 style={{ marginBottom: '8px' }}>Verified competitors</h3>
                  <ul className="fact-list">
                    {research.competitors.map((c, i) => <li key={i}><strong>{c.name}</strong>{c.website ? ` (${c.website})` : ''} — {renderFormattedText(`${c.description} Pricing: ${c.pricing}. [${c.sourceId}]`, sourceMap)}</li>)}
                  </ul>
                </div>
              )}

              {research.gaps?.length > 0 && (
                <div className="notice"><strong>Couldn't verify:</strong> {research.gaps.join(' · ')}. Reports will mark related figures as estimates.</div>
              )}

              {research.droppedUnverified > 0 && (
                <p style={{ fontSize: '13px', color: '#666' }}>{research.droppedUnverified} item(s) were dropped because their source couldn't be matched to an actual search result.</p>
              )}

              <SourcesPanel sources={research.sources} title="All sources" />

              <div style={{ marginTop: '24px' }}>
                <button onClick={onContinue}>Continue to Milestones →</button>
                <button className="secondary" onClick={run}>🔄 Re-run Research</button>
              </div>
            </>
          )}
        </div>
      );
    }

    // Generations keep running when the user navigates to another milestone; this stops a
    // remount from starting a duplicate request for work already in progress.
    const IN_FLIGHT = new Map();

    const PROGRESS_TEXT = {
      model: 'Building the 5-year financial model…',
      report: 'Writing the report… (usually 2–4 minutes)',
      matrix: 'Building the competitor comparison…',
      deck: 'Drafting the pitch deck…',
    };

    function MilestoneStep({ milestone, profile, onCacheUpdate, onUsage, onRunResearch, onNext, onPrev, isFirst, isLast }) {
      const { sow, intake } = profile;
      const key = milestone.key;
      const sig = signaturesFor(sow, intake, key);
      const entry = profile.milestoneReports?.[key] || {};
      const isCompetitor = key === 'competitor';
      const isFinancial = key === 'financial';
      const isPitch = key === 'pitch';
      const needsModel = MODEL_DEPENDENT.has(key);

      const report = entry.reportSignature === sig.report ? entry.report : null;
      const matrix = entry.matrixSignature === sig.matrix ? entry.matrix : null;
      const deck = entry.deckSignature === sig.deck ? entry.deck : null;
      const model = needsModel ? validModel(profile) : null;
      const financialSummary = useMemo(() => (model ? computeFinancialSummary(model) : null), [model]);

      const [status, setStatus] = useState({});
      const [errors, setErrors] = useState({});
      const [regenWrong, setRegenWrong] = useState('');
      const [regenImprove, setRegenImprove] = useState('');
      const [showRegenBox, setShowRegenBox] = useState(false);
      const [deckBuilding, setDeckBuilding] = useState(false);
      const profileRef = useRef(profile);
      profileRef.current = profile;

      const busy = Object.values(status).some(v => v === 'loading');
      const elapsed = useElapsedSeconds(busy);
      const flightKey = `${profile.id}:${key}`;

      const setPart = (part, value, err) => {
        setStatus(prev => ({ ...prev, [part]: value }));
        setErrors(prev => ({ ...prev, [part]: err || null }));
      };

      const missingSomething = () => !report || (isCompetitor && !matrix) || (isPitch && !deck) || (needsModel && !model);

      async function runGeneration({ force = false, notes } = {}) {
        const p = profileRef.current;
        const now = () => new Date().toISOString();
        const base = { sow, intake, businessName: p.name, research: p.research || null, notes };
        const priorContext = priorContextFor(p, key);

        let contextStamp = upstreamStampFor(p, key);
        let currentModel = needsModel ? validModel(p) : null;
        if (needsModel && (!currentModel || (force && isFinancial))) {
          setPart('model', 'loading');
          const res = await fetchFinancialModel({ ...base, notes: isFinancial ? notes : undefined, priorContext });
          const usage = res.data?.usage || res.usage;
          if (usage) onUsage('model', 'financial', usage);
          if (res.error) {
            setPart('model', 'error', res.error);
          } else {
            currentModel = res.data.model;
            const modelGeneratedAt = now();
            onCacheUpdate('financial', { financialModel: currentModel, modelSignature: sig.model, modelGeneratedAt, modelCost: usage });
            if (modelGeneratedAt > contextStamp) contextStamp = modelGeneratedAt;
            setPart('model', 'done');
          }
        }
        const fs = currentModel ? computeFinancialSummary(currentModel) : null;
        if (needsModel && !fs) {
          setPart('report', 'error', 'This milestone is built on the financial model, which could not be generated. Try again.');
          return;
        }

        const ctx = { ...base, priorContext, financialSummary: fs };
        const jobs = [];
        if (force || !report) {
          jobs.push((async () => {
            setPart('report', 'loading');
            const res = await fetchMilestoneReport({ ...ctx, milestoneKey: key, milestoneName: milestone.name });
            const usage = res.data?.usage || res.usage;
            if (usage) onUsage('report', key, usage);
            if (res.error) return setPart('report', 'error', res.error);
            onCacheUpdate(key, { report: res.data.report, reportSignature: sig.report, reportGeneratedAt: now(), reportContextStamp: contextStamp, reportCost: usage });
            setPart('report', 'done');
          })());
        }
        if (isCompetitor && (force || !matrix)) {
          jobs.push((async () => {
            setPart('matrix', 'loading');
            const res = await fetchCompetitorMatrix(ctx);
            const usage = res.data?.usage || res.usage;
            if (usage) onUsage('matrix', key, usage);
            if (res.error) return setPart('matrix', 'error', res.error);
            onCacheUpdate(key, { matrix: res.data.matrix, matrixSignature: sig.matrix, matrixGeneratedAt: now(), matrixCost: usage });
            setPart('matrix', 'done');
          })());
        }
        if (isPitch && (force || !deck)) {
          jobs.push((async () => {
            setPart('deck', 'loading');
            const res = await fetchPitchDeck(ctx);
            const usage = res.data?.usage || res.usage;
            if (usage) onUsage('deck', key, usage);
            if (res.error) return setPart('deck', 'error', res.error);
            onCacheUpdate(key, { deck: res.data.deck, deckSignature: sig.deck, deckGeneratedAt: now(), deckCost: usage });
            setPart('deck', 'done');
          })());
        }
        await Promise.all(jobs);
      }

      async function generate(opts) {
        if (IN_FLIGHT.has(flightKey)) return;
        const promise = runGeneration(opts);
        IN_FLIGHT.set(flightKey, promise);
        try { await promise; } finally { IN_FLIGHT.delete(flightKey); }
      }

      useEffect(() => {
        const running = IN_FLIGHT.get(flightKey);
        if (running) {
          setStatus({ report: 'loading' });
          running.finally(() => setStatus({}));
          return;
        }
        if (missingSomething()) generate();
      }, [flightKey]);

      const closeRegen = () => { setShowRegenBox(false); setRegenWrong(''); setRegenImprove(''); };
      const regenerate = () => {
        const parts = [
          regenWrong.trim() && `What was wrong with the previous version: ${regenWrong.trim()}`,
          regenImprove.trim() && `Improvements or additions required: ${regenImprove.trim()}`,
        ].filter(Boolean);
        closeRegen();
        generate({ force: true, notes: parts.length ? parts.join('\n') : undefined });
      };

      const displayReport = useMemo(() => (report ? injectModelTables(report, financialSummary) : null), [report, financialSummary]);
      const docOpts = { research: profile.research, businessName: profile.name };

      const downloadPDF = () => displayReport && generateReportPDF(displayReport, milestone, intake, docOpts);
      const printReport = () => {
        if (!displayReport) return;
        const printWindow = window.open('', '', 'width=900,height=1100');
        printWindow.document.write(buildReportHTML(displayReport, milestone, intake, docOpts));
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => printWindow.print(), 300);
      };
      const downloadDeck = async () => {
        if (!deck) return;
        setDeckBuilding(true);
        try {
          await generatePitchDeckPptx(deck, financialSummary, profile.research, profile.name);
        } catch (e) {
          reportClientError('pptx', e);
          alert(`The deck couldn't be built: ${e.message}`);
        } finally {
          setDeckBuilding(false);
        }
      };

      const numberedReport = displayReport ? parseAndNumberReport(displayReport) : null;
      const sourceMap = sourceMapOf(profile.research);
      const sources = displayReport ? citedSources(displayReport, profile.research) : [];
      const roadmapBlock = key === 'execbrief' && numberedReport ? findRoadmapBlock(numberedReport) : null;
      const upstreamChanged = report && entry.reportContextStamp && upstreamStampFor(profile, key) > entry.reportContextStamp;
      const milestoneIndex = MILESTONE_CATALOG.findIndex(m => m.key === key);

      return (
        <div className="view">
          <PageHeader
            icon={MILESTONE_META[key]?.icon || 'summary'}
            kicker={`Milestone ${milestoneIndex + 1} of ${MILESTONE_CATALOG.length}`}
            title={milestone.name}
            subtitle={MILESTONE_META[key]?.blurb}
            status={busy ? { text: 'Generating…', pending: true } : displayReport ? { text: 'Report ready' } : null}
          />

          {!profile.research && (
            <div className="notice">
              This engagement has no live web research, so market sizes, competitor details and benchmarks in this report are AI estimates.
              <div><button className="secondary" onClick={onRunResearch} disabled={busy}>🔎 Run Market Research</button></div>
            </div>
          )}

          {upstreamChanged && !busy && (
            <div className="notice">
              Your intake, earlier milestones, the financial model or the market research changed after this report was written, so it may no longer line up with them.
              <div><button className="secondary" onClick={() => generate({ force: true })}>🔄 Regenerate to bring it in line</button></div>
            </div>
          )}

          {busy && Object.entries(status).filter(([, v]) => v === 'loading').map(([part]) => (
            <div key={part} className="progress-line"><div className="spinner"></div> {PROGRESS_TEXT[part]} <span className="muted">{formatElapsed(elapsed)}</span></div>
          ))}
          {busy && report && <p className="muted" style={{ fontSize: '13px', color: '#778' }}>Your current version stays below until the new one is ready. You can move to other milestones meanwhile.</p>}

          {Object.entries(errors).filter(([, e]) => e).map(([part, e]) => (
            <div key={part} className="error">
              {part === 'report' ? 'Report' : part === 'matrix' ? 'Competitor comparison' : part === 'deck' ? 'Pitch deck' : 'Financial model'} error: {e}
              <button className="secondary" style={{ marginLeft: '12px' }} onClick={() => generate()} disabled={busy}>🔄 Try Again</button>
            </div>
          ))}

          {displayReport && (
            <>
              <div className="report-section">
                <h3 style={{ fontFamily: 'var(--font-heading)', fontSize: '20px' }}>{displayReport.title}</h3>
                <div className="ai-disclaimer">{AI_DISCLAIMER}</div>

                {displayReport.cover?.length > 0 && (
                  <div className="report-table-wrap">
                    <table className="report-table">
                      <tbody>{displayReport.cover.map((r, i) => <tr key={i}><td style={{ fontWeight: 700, width: '35%' }}>{r.label}</td><td>{r.value}</td></tr>)}</tbody>
                    </table>
                  </div>
                )}
              </div>

              <ReportSummaryCard report={displayReport} numbered={numberedReport} sourceMap={sourceMap} />

              {roadmapBlock && (
                <div className="summary-card">
                  <h2 className="card-title"><span className="ic"><Icon name="route" size={22} /></span>Action Roadmap</h2>
                  <RoadmapVisual block={roadmapBlock} />
                </div>
              )}

              <ReportContents numbered={numberedReport} />

              <div className="report-section" style={{ paddingTop: '8px', paddingBottom: '8px' }}>
                <SourcesPanel sources={sources} />
                {!sources.length && <p style={{ fontSize: '13px', color: '#778', margin: '10px 0' }}>The full report, with every section above, is in the download.</p>}
              </div>

              <div style={{ textAlign: 'center', margin: '20px 0 4px' }}>
                <button onClick={downloadPDF}>⬇️ Download Full Report</button>
                <button onClick={printReport} className="secondary">🖨️ Print</button>
                {isCompetitor && matrix && (
                  <button onClick={() => generateCompetitorExcel(matrix, milestone, intake, profile.research)}>📊 Download Competitor Comparison (Excel)</button>
                )}
                {isFinancial && model && (
                  <button onClick={() => generateFinancialModelExcel(model, milestone, intake, profile.research, profile.name)}>📈 Download Financial Model (Excel)</button>
                )}
                {isPitch && deck && (
                  <button onClick={downloadDeck} disabled={deckBuilding}>{deckBuilding ? '⏳ Building deck…' : '🖥️ Download Pitch Deck (PowerPoint)'}</button>
                )}
              </div>

              <div style={{ margin: '8px 0 20px', textAlign: 'center' }}>
                {!showRegenBox && (
                  <button className="secondary" onClick={() => setShowRegenBox(true)} disabled={busy}>
                    🔄 Regenerate This Milestone
                  </button>
                )}
                {showRegenBox && (
                  <div className="regen-card">
                    <h3>Regenerate {milestone.name}</h3>
                    <p className="muted">Tell us what to change — type or tap the microphone to dictate. Both fields are optional; leave them blank to simply run it again. Your current version stays saved until the new one is ready.</p>
                    <label className="field-label">What went wrong?</label>
                    <VoiceTextarea ariaLabel="What went wrong" value={regenWrong} onChange={setRegenWrong} rows={3}
                      placeholder="e.g. The market size looks too high, the segments don't match our customers, the tone is too generic…" />
                    <label className="field-label">What improvements or additions are required?</label>
                    <VoiceTextarea ariaLabel="Improvements or additions" value={regenImprove} onChange={setRegenImprove} rows={3}
                      placeholder="e.g. Focus on the EU market, add a conservative scenario, include a pricing comparison table…" />
                    <div className="edit-actions">
                      <button onClick={regenerate} disabled={busy}>🔄 Regenerate</button>
                      <button className="btn-ghost" onClick={closeRegen} disabled={busy}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            </>
          )}

          <div style={{ marginTop: '30px', display: 'flex', gap: '12px' }}>
            <button onClick={onPrev} disabled={isFirst}>← Previous</button>
            <button className="secondary" onClick={onNext}>
              {isLast ? '✅ Complete' : 'Next →'}
            </button>
          </div>
        </div>
      );
    }

    function CompleteStep({ profile, bookingUrl, onOpenMilestone }) {
      const generated = MILESTONE_CATALOG.filter(m => profile.milestoneReports?.[m.key]?.report);
      const financialSummary = useMemo(() => computeFinancialSummary(validModel(profile)), [profile]);
      const [building, setBuilding] = useState(false);

      const downloadBook = async () => {
        setBuilding(true);
        try {
          await generateStrategyBookPDF(profile, MILESTONE_CATALOG, financialSummary);
        } catch (e) {
          reportClientError('strategy-book', e);
          alert(`The Strategy Book couldn't be built: ${e.message}`);
        } finally {
          setBuilding(false);
        }
      };

      return (
        <div className="view">
          <PageHeader icon="complete" tone="gold" kicker={generated.length === MILESTONE_CATALOG.length ? 'Engagement complete' : 'Your deliverables'}
            title="Strategy Book" subtitle="Every milestone in one document, with a contents page and a single list of sources."
            status={{ text: `${generated.length} of ${MILESTONE_CATALOG.length} milestones`, pending: generated.length < MILESTONE_CATALOG.length }} />

          <div className="card">
            <h3 style={{ marginBottom: '8px' }}>Your Strategy Book</h3>
            <p style={{ color: '#555', marginBottom: '12px' }}>One PDF combining every generated milestone, with a contents page and a single list of sources.</p>
            <table className="complete-table">
              <tbody>
                {MILESTONE_CATALOG.map((m, i) => {
                  const done = !!profile.milestoneReports?.[m.key]?.report;
                  return (
                    <tr key={m.key}>
                      <td><span style={{ display: 'inline-flex', alignItems: 'center', gap: 10, color: done ? '#0F766E' : '#8A97A5' }}><Icon name={MILESTONE_META[m.key].icon} size={18} /><span style={{ color: '#102A43', fontWeight: 500 }}>{m.name}</span></span>{done && <span style={{ marginLeft: 8, color: '#0F766E' }}>✓</span>}</td>
                      <td className="num"><button className="secondary" style={{ margin: 0, padding: '6px 12px', fontSize: '12px' }} onClick={() => onOpenMilestone(i)}>{done ? 'Open' : 'Generate'}</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <button onClick={downloadBook} disabled={building || generated.length === 0}>
              {building ? '⏳ Building Strategy Book…' : `📘 Download Strategy Book (${generated.length} milestone${generated.length === 1 ? '' : 's'})`}
            </button>
          </div>

          {bookingUrl && (
            <div className="card">
              <h3 style={{ marginBottom: '8px' }}>Talk it through</h3>
              <p style={{ color: '#555' }}>Book a follow-up call to walk through the strategy and next steps.</p>
              <button style={{ marginTop: '12px' }} onClick={() => window.open(bookingUrl, '_blank', 'noopener')}>📅 Book Follow-up Call</button>
            </div>
          )}

        </div>
      );
    }

    function AppFooter() {
      return (
        <footer className="app-footer">
          © {new Date().getFullYear()} MarketEdge · AI-generated analysis — verify before relying on it
          <div style={{ marginTop: '6px' }}>
            <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>
            <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
          </div>
        </footer>
      );
    }

    // ============ MAIN APP ============
    function App() {
      const [view, setView] = useState('login');
      const [profile, setProfile] = useState(null);
      const [config, setConfig] = useState({});
      const [userEmail, setUserEmail] = useState(() => { try { return localStorage.getItem('marketedge_user') || ''; } catch (e) { return ''; } });

      useEffect(() => {
        loadAppConfig().then(setConfig);
        const currentBusinessId = storage.getCurrentBusinessId();
        const business = currentBusinessId && storage.getProfiles().businesses.find(b => b.id === currentBusinessId);
        if (business) {
          setProfile(business);
          setView('engagement');
        } else if (userEmail) {
          setView('business-selector');
        }
      }, []);

      const hasAnyReport = MILESTONE_CATALOG.some(m => profile?.milestoneReports?.[m.key]?.report);
      const pastScope = !!profile && ['research', 'milestones', 'complete'].includes(profile.stage) || !!profile?.research;
      const allSteps = [
        { key: 'intake', label: 'Business Intake', icon: 'intake', completed: !!profile?.intake },
        { key: 'sow_review', label: 'Scope of Work', icon: 'sow', completed: !!profile?.sow && profile?.stage !== 'sow_review', locked: !profile?.sow },
        { key: 'research', label: 'Market Research', icon: 'research', completed: !!profile?.research, locked: !pastScope },
        ...MILESTONE_CATALOG.map((m, i) => ({
          key: `milestone-${i}`,
          label: m.name,
          icon: MILESTONE_META[m.key].icon,
          completed: !!profile?.milestoneReports?.[m.key]?.report,
          locked: !pastScope,
        })),
        { key: 'complete', label: 'Strategy Book', icon: 'complete', completed: profile?.stage === 'complete', locked: !pastScope || !hasAnyReport }
      ];

      const persistProfile = (prev, updates) => {
        const newProfile = { ...prev, ...updates };
        const profiles = storage.getProfiles();
        const idx = profiles.businesses.findIndex(b => b.id === newProfile.id);
        if (idx >= 0) {
          profiles.businesses[idx] = newProfile;
          storage.saveProfiles(profiles);
        }
        return newProfile;
      };

      const handleUpdateProfile = (updates) => {
        setProfile(prev => persistProfile(prev, updates));
      };

      const handleCacheUpdate = (milestoneKey, patch) => {
        setProfile(prev => persistProfile(prev, {
          milestoneReports: {
            ...prev.milestoneReports,
            [milestoneKey]: { ...(prev.milestoneReports?.[milestoneKey] || {}), ...patch }
          }
        }));
      };

      const recordUsage = (kind, key, usage) => {
        if (!usage) return;
        const row = {
          at: new Date().toISOString(), kind, key,
          usd: Number(usage.usd) || 0,
          inputTokens: usage.inputTokens || 0, outputTokens: usage.outputTokens || 0,
          cacheReadTokens: usage.cacheReadTokens || 0, webSearches: usage.webSearches || 0,
        };
        setProfile(prev => persistProfile(prev, { usageLog: [...(prev.usageLog || []), row] }));
      };

      const handleStepClick = (stepKey) => {
        if (!profile) return;
        // The intake and scope stay reachable at any time, so the client can go back and
        // change them; Cancel on the intake editor returns to where they were.
        if (stepKey === 'intake') {
          if (profile.stage !== 'intake') handleUpdateProfile({ stage: 'intake', stageBeforeEdit: profile.stage });
          return;
        }
        if (stepKey === 'sow_review') {
          if (profile.sow) handleUpdateProfile({ stage: 'sow_review' });
          return;
        }
        if (!pastScope) return;
        if (stepKey === 'research') {
          handleUpdateProfile({ stage: 'research' });
        } else if (stepKey.startsWith('milestone-')) {
          const idx = parseInt(stepKey.split('-')[1]);
          handleUpdateProfile({ stage: 'milestones', currentMilestoneIndex: idx });
        } else if (stepKey === 'complete' && hasAnyReport) {
          handleUpdateProfile({ stage: 'complete' });
        }
      };

      const handleLogin = (email) => {
        setUserEmail(email || '');
        try { localStorage.setItem('marketedge_user', email || ''); } catch (e) { /* storage blocked */ }
        setView('business-selector');
      };

      const handleLogout = () => {
        try { localStorage.removeItem('marketedge_user'); localStorage.removeItem('marketedge_current_business'); } catch (e) { /* storage blocked */ }
        setUserEmail('');
        setProfile(null);
        setView('login');
        window.scrollTo(0, 0);
      };

      // Saves an edited intake. Reports already written stay saved: their cache signatures
      // move to the new intake (otherwise they would vanish), and intakeUpdatedAt flags
      // each one as written on older inputs so it can be refreshed.
      const handleSaveIntakeEdit = (intake, newSow, usage) => {
        setProfile(prev => {
          const sow = newSow || prev.sow;
          const resigned = {};
          Object.entries(prev.milestoneReports || {}).forEach(([key, entry]) => {
            const oldSig = signaturesFor(prev.sow, prev.intake, key);
            const newSig = signaturesFor(sow, intake, key);
            const next = { ...entry };
            [['reportSignature', 'report'], ['matrixSignature', 'matrix'], ['modelSignature', 'model'], ['deckSignature', 'deck']].forEach(([field, part]) => {
              if (entry[field] && entry[field] === oldSig[part]) next[field] = newSig[part];
            });
            resigned[key] = next;
          });
          const back = prev.stageBeforeEdit && prev.stageBeforeEdit !== 'intake' ? prev.stageBeforeEdit : 'milestones';
          return persistProfile(prev, {
            intake, sow, milestoneReports: resigned,
            intakeUpdatedAt: new Date().toISOString(),
            stage: newSow ? 'sow_review' : back,
            stageBeforeEdit: null,
          });
        });
        if (usage) recordUsage('sow', null, usage);
      };

      const handleSelectBusiness = (businessId) => {
        const profiles = storage.getProfiles();
        const business = profiles.businesses.find(b => b.id === businessId);
        if (business) {
          setProfile(business);
          storage.setCurrentBusinessId(businessId);
          setView('engagement');
        }
      };

      const handleCreateBusiness = (name) => {
        const profiles = storage.getProfiles();
        const newBusiness = {
          id: Date.now().toString(),
          name,
          createdAt: new Date().toISOString(),
          stage: 'intake',
          intake: null,
          sow: null,
          research: null,
          milestones: [],
          milestoneReports: {},
          usageLog: [],
          sowFeedback: [],
          currentMilestoneIndex: 0
        };
        profiles.businesses.push(newBusiness);
        storage.saveProfiles(profiles);
        setProfile(newBusiness);
        storage.setCurrentBusinessId(newBusiness.id);
        setView('engagement');
      };

      const handleSwitchBusiness = () => {
        setView('business-selector');
        window.scrollTo(0, 0);
      };

      if (view === 'login') {
        return <LandingPage onLogin={handleLogin} bookingUrl={config.bookingUrl} />;
      }

      if (view === 'business-selector') {
        return <><DashboardView userEmail={userEmail} onSelectBusiness={handleSelectBusiness} onCreateBusiness={handleCreateBusiness} onLogout={handleLogout} /><AppFooter /></>;
      }

      if (view === 'engagement' && profile) {
        const currentIndex = profile.currentMilestoneIndex || 0;
        const currentMilestone = MILESTONE_CATALOG[currentIndex];
        const currentStep = profile.stage === 'intake' ? 'intake'
          : profile.stage === 'sow_review' ? 'sow_review'
          : profile.stage === 'research' ? 'research'
          : profile.stage === 'complete' ? 'complete'
          : `milestone-${currentIndex}`;

        return (
          <div className="app-container">
            <ProgressSidebar
              currentStep={currentStep}
              onStepClick={handleStepClick}
              allSteps={allSteps}
              business={profile}
              onSwitchBusiness={handleSwitchBusiness}
            />
            <div className="main-content">
              {profile.stage === 'intake' && (
                <IntakeStep
                  key={`intake-${profile.intakeUpdatedAt || ''}`}
                  editing={!!profile.sow}
                  initialIntake={profile.intake}
                  initialConsent={profile.consentAt}
                  onSaveEdit={handleSaveIntakeEdit}
                  onCancelEdit={() => handleUpdateProfile({ stage: profile.stageBeforeEdit && profile.stageBeforeEdit !== 'intake' ? profile.stageBeforeEdit : 'sow_review', stageBeforeEdit: null })}
                  onComplete={(intake, sow, usage) => {
                    handleUpdateProfile({ intake, sow, stage: 'sow_review', consentAt: profile.consentAt || new Date().toISOString() });
                    recordUsage('sow', null, usage);
                  }}
                />
              )}
              {profile.stage === 'sow_review' && profile.sow && (
                <SOWStep
                  sow={profile.sow}
                  intake={profile.intake}
                  onUsage={recordUsage}
                  onRevision={(newSOW) => {
                    handleUpdateProfile({ sow: newSOW });
                  }}
                  onApprove={() => {
                    handleUpdateProfile({ stage: 'research', currentMilestoneIndex: 0 });
                  }}
                />
              )}
              {profile.stage === 'research' && (
                <ResearchStep
                  profile={profile}
                  onUsage={recordUsage}
                  onResearch={(research) => handleUpdateProfile({ research })}
                  onSkip={() => handleUpdateProfile({ stage: 'milestones' })}
                  onContinue={() => handleUpdateProfile({ stage: 'milestones' })}
                />
              )}
              {profile.stage === 'milestones' && currentMilestone && (
                <MilestoneStep
                  key={currentMilestone.key}
                  milestone={currentMilestone}
                  profile={profile}
                  onCacheUpdate={handleCacheUpdate}
                  onUsage={recordUsage}
                  onRunResearch={() => handleUpdateProfile({ stage: 'research' })}
                  onNext={() => {
                    if (currentIndex >= MILESTONE_CATALOG.length - 1) {
                      handleUpdateProfile({ stage: 'complete' });
                    } else {
                      handleUpdateProfile({ currentMilestoneIndex: currentIndex + 1 });
                    }
                  }}
                  onPrev={() => {
                    if (currentIndex > 0) {
                      handleUpdateProfile({ currentMilestoneIndex: currentIndex - 1 });
                    }
                  }}
                  isFirst={currentIndex === 0}
                  isLast={currentIndex >= MILESTONE_CATALOG.length - 1}
                />
              )}
              {profile.stage === 'complete' && (
                <CompleteStep
                  profile={profile}
                  bookingUrl={config.bookingUrl}
                  onOpenMilestone={(idx) => handleUpdateProfile({ stage: 'milestones', currentMilestoneIndex: idx })}
                />
              )}
              <AppFooter />
            </div>
          </div>
        );
      }

      return <div className="view"><p>Loading...</p></div>;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
